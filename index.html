 app.innerHTML=`<div class="card"><div class="grid">${Object.entries(MODES).map(([k,[n,s]])=>`<button class="mode ${k==='struct'||k==='cloze'?'hot':''}" data-m="${k}">${n} <small>${s} · ${cnt(k)}문항</small></button>`).join('')}</div></div>
 <div class="card"><b>필터</b> <span class="meta">(비우면 전체)</span>${chips(F.d,AREAS,'영역')}${chips(F.g,GR,'등급')}${chips(F.t,TYPES,'유형')}
 <div class="chips"><button class="chip ${F.due?'on':''}" id="due">복습 예정만(간격 반복)</button><button class="chip ${F.shuffle?'on':''}" id="shf">섞기</button><button class="chip" id="clr">필터 초기화</button></div></div>
 <div class="card"><b>영역별 진도</b>${stats()}<button class="btn l" id="reset">학습 기록 초기화</button></div>
 <div class="card meta">S·A+·A 중심, B는 가볍게. 근거: 교육학 논술 핵심정리(출력용)·원문 교재. 기록은 이 기기 브라우저에 저장됩니다.</div>`;
 app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));
 app.querySelectorAll('.chip[data-set]').forEach(b=>b.onclick=()=>{const S={영역:F.d,등급:F.g,유형:F.t}[b.dataset.set],v=b.dataset.v;S.has(v)?S.delete(v):S.add(v);home()});
 $('#due').onclick=()=>{F.due=!F.due;home()};$('#shf').onclick=()=>{F.shuffle=!F.shuffle;home()};$('#clr').onclick=()=>{F.d.clear();F.g.clear();F.t.clear();F.due=false;home()};
 $('#reset').onclick=()=>{if(confirm('모든 학습 기록을 지울까요?')){st={sr:{},wr:{},hist:{}};save();home()}}}
function stats(){let rows=AREAS.map(a=>{const its=DATA.items.filter(x=>x.d===a);let seen=0,mast=0,c=0,w=0;
  its.forEach(x=>{const r=st.sr[x.id],h=st.hist[x.id];if(h){seen++;c+=h.c;w+=h.w}if(r&&r.b>=3)mast++});
  const p=Math.round(100*mast/its.length);return `<tr><td>${a}</td><td>${seen}/${its.length}</td><td>${c+w?Math.round(100*c/(c+w))+'%':'-'}</td><td style="width:30%"><div class="bar"><i style="width:${p}%"></i></div>${p}%</td></tr>`}).join('');
 return `<table><tr><th>영역</th><th>학습</th><th>정답률</th><th>숙달(3단계↑)</th></tr>${rows}</table><div class="prog">오답노트 ${Object.keys(st.wr).length}문항</div>`}
let Q=[],qi=0,M='';
function start(m){M=m;Q=pool(m);qi=0;if(!Q.length){alert('해당 조건의 문항이 없습니다.');return}$('#ttl').textContent=MODES[m][0];show()}
function head(x){return `<div class="prog">${qi+1} / ${Q.length}</div><div class="meta"><span class="tag">${esc(x.d)}</span><span class="tag">${x.g==='S'?'S 최우선':x.g==='A'?'A':'B'}</span><span class="tag">${esc(x.t)}</span>${st.wr[x.id]?'<span class="tag" style="color:#c62828">오답 '+st.wr[x.id]+'</span>':''}</div>`}
function next(){qi++;if(qi>=Q.length){app.innerHTML=`<div class="card"><div class="q">한 세트 완료!</div>${stats()}<button class="btn" id="again">다시 하기</button><button class="btn l" id="h">홈</button></div>`;$('#again').onclick=()=>start(M);$('#h').onclick=home;return}show()}
function show(){const x=Q[qi];const m=M==='wrong'?(x.k):M;window.scrollTo(0,0);
 ({card:showCard,mcq:showMcq,short:showShort,struct:showStruct,cloze:showCloze})[m](x)}
function judgeBtns(id,cb){return `<div class="row"><button class="btn r" id="no">모르겠어요</button><button class="btn g" id="ok">알아요</button></div>`}
function bindJudge(id){$('#ok').onclick=()=>{grade(id,true);next()};$('#no').onclick=()=>{grade(id,false);next()}}
function showCard(x){app.innerHTML=`<div class="card flip" id="fl">${head(x)}<div class="q">${esc(x.q)}</div><div class="meta">탭하면 뒤집기</div><div id="bk"></div></div><div id="jd"></div>`;
 $('#fl').onclick=()=>{if($('#bk').innerHTML)return;$('#bk').innerHTML=`<div class="ans"><b>${esc(x.a)}</b>${x.e?'<br><span class="meta">'+esc(x.e)+'</span>':''}</div>`;$('#jd').innerHTML=judgeBtns();bindJudge(x.id)}}
function showMcq(x){const opts=shuf([x.a,...x.x]);app.innerHTML=`<div class="card">${head(x)}<div class="q">${esc(x.q)}</div>${opts.map((o,i)=>`<button class="opt" data-i="${i}">${'①②③④'[i]} ${esc(o)}</button>`).join('')}<div id="ex"></div></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if($('#ex').innerHTML)return;const ok=opts[b.dataset.i]===x.a;
  app.querySelectorAll('.opt').forEach(o=>{if(opts[o.dataset.i]===x.a)o.classList.add('ok')});if(!ok)b.classList.add('no');grade(x.id,ok);
  $('#ex').innerHTML=`<div class="ans ${ok?'':'bad'}"><b>${ok?'정답!':'오답'}</b> 정답: ${esc(x.a)}${x.e?'<br>'+esc(x.e):''}${x.why?'<br><span class="meta">'+esc(x.why)+'</span>':''}</div><button class="btn" id="nx">다음</button>`;$('#nx').onclick=next})}
const norm=s=>String(s).toLowerCase().replace(/[\s\(\)\[\]·,.\/→\-~'"“”‘’:;!?]/g,'');
function kwCheck(inp,kw){const n=norm(inp);const gs=kw.split(';').filter(Boolean);return gs.map(g=>({g:g.split('|')[0],hit:g.split('|').some(a=>n.includes(norm(a)))}))}
function showShort(x){app.innerHTML=`<div class="card">${head(x)}<div class="q">${esc(x.q)}</div><input type="text" id="in" placeholder="답 입력 (핵심어 위주로)" autocomplete="off"><button class="btn" id="ck">채점</button><div id="ex"></div></div>`;
 const go=()=>{if($('#ex').innerHTML)return;const r=kwCheck($('#in').value,x.kw);const h=r.filter(z=>z.hit).length,need=Math.ceil(r.length*0.75);const ok=h>=need&&r.length>0;
  $('#ex').innerHTML=`<div class="ans ${ok?'':'bad'}"><b>${ok?'정답 인정':'아직 부족'}</b> (핵심어 ${h}/${r.length})<br>${r.map(z=>`<span class="${z.hit?'kw':'kwn'}">${z.hit?'✔':'✘'} ${esc(z.g)}</span>`).join(' ')}<br><b>모범답안:</b> ${esc(x.a)}${x.e?'<br><span class="meta">'+esc(x.e)+'</span>':''}</div>
  <div class="meta">자동 채점이 틀렸다면 직접 판정하세요.</div><div class="row"><button class="btn r" id="no">틀림으로</button><button class="btn g" id="ok">맞음으로</button></div>`;
  $('#ok').onclick=()=>{grade(x.id,true);next()};$('#no').onclick=()=>{grade(x.id,false);next()};
  if(ok)$('#ok').classList.add('y');else $('#no').classList.add('y')};
 $('#ck').onclick=go;$('#in').onkeydown=e=>{if(e.key==='Enter')go()};$('#in').focus()}
const circ=i=>'①②③④⑤⑥⑦⑧⑨'[i];
function showStruct(x){let n=0;const P=x.p;app.innerHTML=`<div class="card">${head(x)}<div class="q">${esc(x.c)}</div><div>${esc(x.q)} — <b>${P.length}가지</b></div>
 <div class="meta">먼저 머릿속(또는 아래 메모)으로 ${P.length}가지를 떠올린 뒤 하나씩 공개하세요.</div><textarea id="memo" rows="3" placeholder="메모(선택)"></textarea>
 <div id="pts">${P.map((p,i)=>`<div class="pt" id="p${i}"><span class="num">${i+1}</span><span class="blank">______</span></div>`).join('')}</div><div id="hk"></div>
 <button class="btn" id="rv">다음 공개 (1/${P.length})</button><button class="btn l" id="all">모두 공개</button><div id="jd"></div></div>`;
 const open=i=>{const p=P[i];const e=$('#p'+i);e.classList.add('open');e.innerHTML=`<span class="num">${i+1}</span><b>${esc(p.k)}</b><br>${esc(p.s)}`};
 const fin=()=>{$('#rv').style.display='none';$('#all').style.display='none';if(x.h)$('#hk').innerHTML=`<div class="hook">연상: ${esc(x.h)}</div>`;
  $('#jd').innerHTML=`<div class="row"><button class="btn r" id="no">일부/모름</button><button class="btn g" id="ok">${P.length}가지 다 맞힘</button></div>`;bindJudge(x.id)};
 $('#rv').onclick=()=>{open(n++);if(n>=P.length)fin();else $('#rv').textContent=`다음 공개 (${n+1}/${P.length})`};
 $('#all').onclick=()=>{while(n<P.length)open(n++);fin()}}
function blankSent(p){const s=p.s,k=p.k.replace(/^[^:]+:\s*/,'');const core=k.split(/[(·\/]/)[0].trim();
 if(core.length>=2&&s.includes(core))return{html:esc(s).replace(esc(core),'<input type="text" class="bl" style="width:9em;display:inline-block;padding:4px">'),ans:core};
 return{html:'<input type="text" class="bl" style="width:11em;display:inline-block;padding:4px"> — '+esc(s),ans:k}}
function showCloze(x){const B=x.p.map(blankSent);app.innerHTML=`<div class="card">${head(x)}<div class="q">${esc(x.c)}</div><div>${esc(x.q)} — 빈칸의 핵심어를 채우세요</div>
 ${B.map((b,i)=>`<div class="pt open"><span class="num">${i+1}</span>${b.html}<div class="meta" id="r${i}"></div></div>`).join('')}<button class="btn" id="ck">채점</button><div id="jd"></div></div>`;
 $('#ck').onclick=()=>{const ins=app.querySelectorAll('.bl');let c=0;B.forEach((b,i)=>{const v=norm(ins[i].value),a=norm(b.ans);const ok=v&&(a.includes(v)&&v.length>=Math.min(2,a.length)||v.includes(a));if(ok)c++;window._cz=c;
  $('#r'+i).innerHTML=`<span class="${ok?'kw':'kwn'}">${ok?'✔':'✘'} 정답: ${esc(b.ans)}</span>`});
  const ok=c===B.length;
  $('#ck').style.display='none';$('#jd').innerHTML=`<div class="ans ${ok?'':'bad'}">${c}/${B.length} 정답${x.h?' · 연상: '+esc(x.h):''}</div><div class="row"><button class="btn r" id="no">틀림으로</button><button class="btn g" id="ok">맞음으로</button></div>`;
  $('#ok').onclick=()=>{grade(x.id,true);next()};$('#no').onclick=()=>{grade(x.id,false);next()}}}
$('#homeBtn').onclick=home;home();
</script></body></html>
