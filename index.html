<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0f1217" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="교육학퀴즈">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/favicon-32.png">
<title>교육학 논술 암기퀴즈</title><style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#191f28;--mut:#6b7684;--bd:#e5e8eb;--acc:#3a5bd9;--accs:#ebf0ff;--ok:#12a150;--oks:#e7f7ee;--bad:#e5484d;--bads:#fdecec;--warn:#f59f00;--warns:#fff6e0;--sh:0 2px 14px rgba(20,30,50,.06);--S:#e5484d;--A:#3a5bd9;--B:#8b95a1}
[data-theme=dark]{--bg:#0f1217;--card:#1a1e26;--fg:#eef1f5;--mut:#9aa4b2;--bd:#2b313c;--acc:#5b7cfa;--accs:#1d2742;--oks:#10301f;--bads:#3a1a1c;--warns:#3a2e10;--sh:0 2px 14px rgba(0,0,0,.4)}
[hidden]{display:none!important}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:16.5px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;padding-bottom:calc(76px + env(safe-area-inset-bottom));transition:background .2s}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top)}
.hd{max-width:760px;margin:0 auto;padding:8px max(14px,env(safe-area-inset-left));display:flex;align-items:center;gap:8px;min-height:56px}
.hd h1{font-size:18px;margin:0;flex:1;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd h1 b{color:var(--acc)}
.ib{min-width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:18px;display:inline-flex;align-items:center;justify-content:center}
nav#nav{display:flex;gap:4px}nav#nav button{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:6px 12px;border-radius:12px;color:var(--mut);font-size:14px;font-weight:600}
nav#nav .ic{font-size:21px;line-height:1.1}nav#nav button.on{color:var(--acc);background:var(--accs)}
nav#nav button{position:relative}nav#nav .bd{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;margin-left:2px;vertical-align:top}
@media(max-width:719px){header{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--bd);justify-content:space-around;padding:4px max(4px,env(safe-area-inset-left)) calc(4px + env(safe-area-inset-bottom))}nav#nav button{flex:1;font-size:11.5px;min-height:54px;padding:4px 2px}nav#nav button.on{background:none}}
@media(min-width:720px){body{padding-bottom:30px}nav#nav button{flex-direction:row;gap:6px}}
main{max-width:760px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-left)) 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:var(--sh)}
h2{font-size:16px;margin:0 0 10px;letter-spacing:-.2px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center}
.ring>div{width:68px;height:68px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1.1}.ring b{font-size:20px}.ring small{font-size:11px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:var(--bg);border-radius:12px;padding:8px;text-align:center}.kpi b{display:block;font-size:19px}.kpi span{font-size:12px;color:var(--mut)}
.week{display:flex;gap:5px;margin-top:10px;justify-content:space-between}.week i{flex:1;height:26px;border-radius:7px;background:var(--bd);font-style:normal;font-size:10.5px;color:var(--mut);display:grid;place-items:center}.week i.l1{background:color-mix(in srgb,var(--acc) 35%,var(--card));color:var(--fg)}.week i.l2{background:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1px solid var(--bd);border-radius:16px;padding:14px 12px;background:var(--card);text-align:left;min-height:96px;display:flex;flex-direction:column;gap:2px;transition:transform .1s}
.mode:active{transform:scale(.97)}.mode .ic{font-size:24px}.mode b{font-size:16px}.mode small{font-size:12.5px;color:var(--mut);line-height:1.4}
.mode.hot{border-color:var(--acc);background:var(--accs)}.mode .n{font-size:12px;font-weight:700;color:var(--acc)}
.cta{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:16px;padding:14px 16px;background:var(--acc);color:#fff;text-align:left;margin-bottom:12px;min-height:64px}.cta b{font-size:17px;display:block}.cta small{opacity:.85}.cta .ic{font-size:26px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;flex-wrap:wrap}
.chip{flex:none;min-height:40px;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
label.t{font-size:13px;color:var(--mut);font-weight:700;display:block;margin-top:8px}
.btn{border:0;border-radius:14px;padding:0 14px;min-height:52px;font-size:16px;font-weight:700;background:var(--acc);color:#fff;width:100%;margin-top:10px;transition:transform .08s,filter .15s}.btn:active{transform:scale(.98);filter:brightness(.95)}
.btn.g{background:var(--ok)}.btn.r{background:var(--bad)}.btn.l{background:var(--accs);color:var(--acc)}.btn.y{box-shadow:0 0 0 3px var(--warn)}
.btn kbd,.opt kbd{display:none}@media(hover:hover) and (pointer:fine){.btn kbd{display:inline;font-size:11px;opacity:.7;margin-left:6px;font-family:inherit;border:1px solid currentColor;border-radius:4px;padding:0 4px}}
.row{display:flex;gap:10px}.row>*{flex:1}
.meta{font-size:12.5px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:0 7px;font-weight:600}.tag.S{color:var(--S);border-color:var(--S)}.tag.A{color:var(--A)}
.q{font-size:18px;font-weight:700;margin:10px 0;letter-spacing:-.2px;line-height:1.55}
.sbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}.sbar .bar{flex:1}.sbar span{font-size:13px;color:var(--mut);font-weight:700;min-width:58px;text-align:right}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.ans{background:var(--oks);border-left:4px solid var(--ok);padding:12px;border-radius:12px;margin-top:12px;animation:pop .2s}
.ans.bad{background:var(--bads);border-color:var(--bad)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--bd);background:var(--card);border-radius:14px;padding:13px 14px;margin:8px 0;font-size:15.5px;min-height:52px;line-height:1.5;transition:border-color .15s,background .15s}
.opt .no_{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--bd);display:grid;place-items:center;font-size:13px;font-weight:700}
@media(hover:hover){.opt:hover{border-color:var(--acc)}}
.opt.ok{background:var(--oks);border-color:var(--ok);font-weight:700}.opt.ok .no_{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--bads);border-color:var(--bad)}.opt.no .no_{background:var(--bad);color:#fff;border-color:var(--bad)}
input[type=text],textarea{width:100%;font-size:16px;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--acc);background:var(--card)}
.pt{border:1.5px dashed var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.pt.open{border-style:solid;border-color:var(--acc);background:var(--accs);animation:pop .2s}.pt.open.cz{background:var(--card);border-color:var(--bd)}
.pt b{color:var(--acc)}.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-size:13px;margin-right:6px;font-weight:700}
.hook{background:var(--warns);border-radius:12px;padding:10px;margin-top:10px;font-weight:700}
.blank{border-bottom:2px solid var(--acc);min-width:70px;display:inline-block;color:transparent}
.pt input.bl{padding:6px 10px!important;margin:2px 0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mut);font-size:12.5px}
.prog{font-size:13px;color:var(--mut);margin:6px 0}.kw{color:var(--ok);font-weight:700}.kwn{color:var(--bad);font-weight:700}
/* flip card */
.flipw{perspective:1400px;margin-bottom:4px}.flipi{position:relative;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;min-height:300px;display:grid}
.flipw.fl .flipi{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:var(--sh);display:flex;flex-direction:column;cursor:pointer}
.face.back{transform:rotateY(180deg);border-color:var(--ok)}.face .q{flex:1;display:flex;align-items:center;font-size:19px}
.face .hint{text-align:center;color:var(--mut);font-size:13px}.face .a{font-size:17px;font-weight:700;margin:12px 0 8px}.face .e{color:var(--mut);font-size:14.5px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:9;animation:pop .2s}
.done{text-align:center}.done .big{font-size:44px}
.psg{background:var(--soft,rgba(127,127,127,.08));border-left:4px solid var(--acc,#3b82f6);padding:12px;border-radius:8px;line-height:1.7;margin-bottom:10px;white-space:pre-wrap}
textarea{width:100%;box-sizing:border-box;font-size:16px;padding:10px;border-radius:10px;border:1px solid rgba(127,127,127,.35);background:transparent;color:inherit;margin:6px 0}
table.fr{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}table.fr td:first-child{width:26%}table.fr td,table.fr th{border:1px solid rgba(127,127,127,.3);padding:6px;vertical-align:top;text-align:left}
table.fr tr.hl td{background:rgba(250,204,21,.25)}details.frp{margin:10px 0;border:1px solid rgba(127,127,127,.3);border-radius:10px;padding:8px}details.frp summary{font-weight:700;cursor:pointer}
.wrongs div{margin-top:6px;font-size:14px}.opt small.why{display:block;width:100%;font-size:12px;opacity:.8;margin-top:4px}.opt{flex-wrap:wrap}.cbtn{align-items:center;gap:8px}
</style></head><body>
<header><div class="hd"><button class="ib" id="backBtn" aria-label="홈으로" hidden>←</button><h1 id="ttl">📘 교육학 <b>논술 암기</b></h1>
<nav id="nav"><button data-n="home" class="on"><span class="ic">🏠</span>홈</button><button data-n="today"><span class="ic">⚡</span>오늘 복습</button><button data-n="wrong"><span class="ic">📕</span>오답<span class="bd" id="wbd"></span></button><button data-n="con"><span class="ic">📚</span>개념</button><button data-n="stats"><span class="ic">📊</span>통계</button></nav>
<button class="ib" id="theme" aria-label="다크 모드 전환">🌙</button></div></header>
<main id="app"></main>

 if(mode==='today'){const now=Date.now();return it.filter(x=>st.sr[x.id]&&st.sr[x.id].d<=now).sort((a,b)=>st.sr[a.id].d-st.sr[b.id].d)}

 let wk='';for(let i=6;i>=0;i--){const k=dk(Date.now()-i*DAY),n=st.days[k]||0;wk+=`<i class="${n>=GOAL?'l2':n?'l1':''}">${'일월화수목금토'[new Date(Date.now()-i*DAY).getDay()]}</i>`}
 const mast=DATA.items.filter(x=>st.sr[x.id]&&st.sr[x.id].b>=3).length;

function home(){VIEW='home';F.c=null;setNav('home');$('#ttl').innerHTML='📘 교육학 <b>논술 암기</b>';const cnt=m=>pool(m).length,due=cnt('today');
 app.innerHTML=heroCard()+`<button class="cta" id="goCon" style="margin-bottom:12px"><span class="ic">📚</span><span><b>개념별 학습 (${CON.length}개 개념)</b><small>영역 > 개념 > 전체 구조 → 사례형 → 논술 문장 → 객관식 순서로</small></span></button>`+
 `<button class="cta" id="go22" style="margin-bottom:12px"><span class="ic">📗</span><span><b>${F.x22?'2022 연계만 보는 중 · 해제':'2022 개정 연계 집중 '+DATA.items.filter(is22).length+'문항'}</b><small>총론 원문 + 이론 연결 문장</small></span></button>`+

 <div class="card meta">모든 문항은 핵심정리(출력용)·원페이지 교육학·2022 총론 근거. 정답 후 <b>🗂️ 개념 전체 구조</b>가 함께 열려 다른 구성요소까지 같이 복습됩니다. 기록은 이 기기에 저장됩니다.</div>`;

 $('#due').onclick=()=>{F.due=!F.due;saveF();home()};$('#shf').onclick=()=>{F.shuffle=!F.shuffle;saveF();home()};$('#clr').onclick=()=>{F.d.clear();F.g.clear();F.due=false;F.x22=false;saveF();home()}}

 app.innerHTML=`<div class="card"><div class="meta"><span class="tag ${c.g}">${c.g}</span><span class="tag">${esc(c.d)}</span><span class="tag">${esc(c.src)}</span></div><h2>개념 전체 구조</h2>${frameTable(c)}</div>

function statsView(){setNav('stats');$('#ttl').innerHTML='📊 <b>학습 통계</b>';
 app.innerHTML=heroCard()+`<div class="card"><h2>영역별 진도</h2>${stats()}</div><div class="card"><h2>설정</h2><button class="btn l" id="exp">학습 기록 백업(복사)</button><button class="btn l" id="imp">백업 붙여넣어 복원</button><button class="btn r" id="reset">학습 기록 초기화</button></div>`;
 $('#reset').onclick=()=>{if(confirm('모든 학습 기록을 지울까요?')){st={sr:{},wr:{},hist:{},days:{}};save();badge();statsView()}};
 $('#exp').onclick=async()=>{const t=localStorage.getItem(LS)||'{}';try{await navigator.clipboard.writeText(t);toast('클립보드에 복사됨')}catch(e){prompt('아래 내용을 복사해 두세요',t)}};
 $('#imp').onclick=()=>{const t=prompt('백업 내용을 붙여넣으세요');if(!t)return;try{const o=JSON.parse(t);if(!o.sr)throw 0;st=o;st.wr=st.wr||{};st.hist=st.hist||{};st.days=st.days||{};save();badge();toast('복원 완료');statsView()}catch(e){alert('형식이 올바르지 않습니다')}}}
function stats(){let rows=AREAS.map(a=>{const its=DATA.items.filter(x=>x.d===a);let seen=0,mast=0,c=0,w=0;
  its.forEach(x=>{const r=st.sr[x.id],h=st.hist[x.id];if(h){seen++;c+=h.c;w+=h.w}if(r&&r.b>=3)mast++});
  const p=Math.round(100*mast/its.length);return `<tr><td><b>${a}</b></td><td>${seen}/${its.length}</td><td>${c+w?Math.round(100*c/(c+w))+'%':'-'}</td><td style="width:32%"><div class="bar"><i style="width:${p}%"></i></div><span class="meta">${p}%</span></td></tr>`}).join('');
 return `<table><tr><th>영역</th><th>학습</th><th>정답률</th><th>숙달</th></tr>${rows}</table><div class="prog">오답노트 ${Object.keys(st.wr).length}문항</div>`}

 setNav(m==='today'||m==='wrong'?m:'');const t=MODES[m]||TT[m];$('#ttl').innerHTML=t[0]+' <b>'+t[1]+'</b>';show()}

 app.innerHTML=`<div class="card done"><div class="big">${sess.w===0?'🏆':'🎯'}</div><div class="q" style="justify-content:center">한 세트 완료!</div><div class="kpis"><div class="kpi"><b>${tot}</b><span>푼 문항</span></div><div class="kpi"><b style="color:var(--ok)">${sess.c}</b><span>맞음</span></div><div class="kpi"><b style="color:var(--bad)">${sess.w}</b><span>틀림</span></div></div>
 <button class="btn" id="again">다시 하기<kbd>Enter</kbd></button>${Object.keys(st.wr).length?'<button class="btn l" id="gw">오답노트 복습</button>':''}<button class="btn l" id="h">${F.c?'개념으로':'홈'}</button></div>`;$('#again').onclick=()=>start(M);$('#h').onclick=()=>F.c?conOne(F.c):home();if($('#gw'))$('#gw').onclick=()=>start('wrong');return}show()}

function judgeRow(ok){return `<div class="meta" style="margin-top:8px">자동 채점이 다르면 직접 판정하세요.</div><div class="row"><button class="btn r ${ok===false?'y':''}" id="no">틀림으로<kbd>←</kbd></button><button class="btn g ${ok?'y':''}" id="ok">맞음으로<kbd>→</kbd></button></div>`}
function bindJudge(id,ok){$('#ok').onclick=()=>{grade(id,true);next()};$('#no').onclick=()=>{grade(id,false);next()};setTimeout(()=>{KEY=e=>{if(e.key==='Enter'&&ok!==undefined)(ok?$('#ok'):$('#no')).click();else if(e.key==='ArrowRight')$('#ok').click();else if(e.key==='ArrowLeft')$('#no').click()}},50)}
const norm=s=>String(s).toLowerCase().replace(/[\s\(\)\[\]·,.\/→\-~'"“”‘’:;!?㉠㉡㉢]/g,'');
const kwHits=(inp,kw)=>{const n=norm(inp);return kw.map(g=>({g:g[0],hit:g.some(a=>n.includes(norm(a)))}))};

  const r=kwHits($('#ta').value,x.kw),h=r.filter(z=>z.hit).length,need=Math.max(1,Math.round(r.length*0.6));const ok=bc===x.bl.length&&h>=need;$('#ck').style.display='none';document.activeElement.blur();

 $('#rv').onclick=()=>{open(n++);if(n>=P.length)fin();else $('#rv').textContent=`다음 공개 (${n+1}/${P.length})`};
 $('#all').onclick=()=>{while(n<P.length)open(n++);fin()};KEY=e=>{if(e.key==='Enter'||e.key===' ')$('#rv').click()}}
function showFrame(x){const c=CI[x.c];app.innerHTML=`${head(x)}<div class="card" style="margin-top:10px"><div class="q">「${esc(c.n)}」의 구성요소 ${c.f.length}가지를 정의·수업 적용과 함께 떠올려 보세요.</div>
 <div class="meta">${c.f.map((r,i)=>`${i+1}. ${'□'.repeat(3)}`).join('  ')}</div><button class="btn" id="rv">전체 구조 보기</button><div id="ex"></div></div>`;
 $('#rv').onclick=()=>{$('#rv').style.display='none';$('#ex').innerHTML=frameTable(c)+`<div class="row"><button class="btn r" id="no">일부/모름<kbd>←</kbd></button><button class="btn g" id="ok">다 떠올림<kbd>→</kbd></button></div>`;bindJudge(x.id)};KEY=e=>{if(e.key==='Enter'||e.key===' ')$('#rv').click()}}
document.addEventListener('keydown',e=>{if(e.isComposing)return;const tag=(e.target.tagName||'');if(e.key==='Escape'){home();return}
 if((tag==='INPUT'||tag==='TEXTAREA')&&e.key!=='Enter')return;if(tag==='INPUT'||tag==='TEXTAREA')return;if(tag==='BUTTON'&&(e.key==='Enter'||e.key===' '))e.preventDefault();if(KEY){if(e.key===' ')e.preventDefault();KEY(e)}});
const applyTheme=t=>{document.documentElement.dataset.theme=t;$('#theme').textContent=t==='dark'?'☀️':'🌙';document.querySelectorAll('meta[name=theme-color]').forEach(m=>m.content=t==='dark'?'#0f1217':'#f5f6f8')};
applyTheme(localStorage.getItem('edu_quiz_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('edu_quiz_theme',t);applyTheme(t)};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{const n=b.dataset.n;n==='home'?home():n==='stats'?statsView():n==='con'?conView():start(n)});
$('#backBtn').onclick=()=>{if(VIEW==='quiz'&&F.c)conOne(F.c);else if(VIEW==='conOne')conView();else home()};badge();home();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
