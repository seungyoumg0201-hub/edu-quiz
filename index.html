,"parent":"equal"},{"id":"colem","d":"상담·사회·철학","g":"B","n":"Coleman 보고서","src":"핵심정리 Part6 / 논술 14","f":[{"k":"Coleman 보고서","df":"학업성취 차이는 학교 조건보다 가정배경(사회자본)의 영향이 큼 → 결과적 평등 논의","u":"가정 배경 격차 보완"}],"l22":"","core":"","parent":"equal"},{"id":"delin","d":"상담·사회·철학","g":"B","n":"비행이론","src":"핵심정리 Part6 / 논술 14","f":[{"k":"비행이론","df":"낙인이론(Becker: 낙인 → 자기 정체성화), 사회통제이론(Hirschi: 유대 약화), 차별접촉이론(Sutherland: 비행 학습), 아노미이론(Merton)","u":"낙인 피하기, 학교 유대 강화"}],"l22":"","core":"","parent":"equal"},{"id":"phil","d":"상담·사회·철학","g":"B","n":"교육철학: 자유교육(Peters)","src":"논술 15","f":[{"k":"자유교육","df":"지식의 형식을 통해 마음을 계발하는 교육. 지식 그 자체의 내재적 가치 추구(도구적 목적 X)","u":"교과의 본질적 가치를 경험하게 하는 수업"},{"k":"Peters 교육의 개념 준거","df":"규범적 준거(가치 있는 것 전달), 인지적 준거(지식·이해·인지적 안목), 과정적 준거(도덕적으로 온당한 방식, 학습자 의식·자발성)","u":"강제·세뇌가 아닌 이해 중심"},{"k":"지식의 형식(Hirst)","df":"수학, 자연과학, 인문학, 역사, 종교, 철학, 문학·예술, 도덕 등 고유 개념·검증 방식","u":"교과별 고유 탐구 방식"}],"l22":"핵심 아이디어 중심 깊이 있는 학습(교과 본질), 교양 있는 사람","core":""},{"id":"media","d":"교수·공학","g":"B","n":"교수매체·교육공학 이론(지교론 연계)","src":"지교론 안재섭 1~7장 / 원페이지 교육공학","f":[{"k":"Dale 경험의 원추·Hoban 시각교육","df":"행동적(직접·구성된 경험) → 영상적(시범·견학·영화·사진) → 상징적(시각 기호·언어 기호) 순으로 갈수록 추상화된다. Hoban은 시각자료를 구체성 정도(실물 → 모형 → 영화 → 사진 → 지도·도표 → 언어)로 배열","u":"구체적 경험에서 출발해 추상적 기호로 단계적으로 제시"},{"k":"Berlo SMCR·Shannon-Schramm 모형","df":"SMCR: 송신자·전달내용·통신수단·수신자. 송신자와 수신자는 통신기술·태도·지식수준·사회체제·문화양식의 영향을 받고, 피드백이 없는 선형 모형. Shannon-Schramm: 경험의 장, 기호화·해독, 잡음, 피드백을 포함하며 경험의 장이 겹칠수록 통신이 원활","u":"학생의 경험 세계를 이해해 공통 경험의 장을 넓히고, 교실 잡음을 줄이며, 피드백 통로를 확보"},{"k":"Clark vs Kozma 매체 논쟁","df":"Clark: 매체는 교수 내용을 실어 나르는 운반 수단(식료품 배달 트럭)일 뿐이며 학습 효과는 교수방법이 결정. Kozma: 매체의 고유 속성(상징체계·처리 능력)이 교수방법과 상호작용해 학습에 영향","u":"매체 자체보다 교수방법 설계를 먼저 하되, 매체 고유 속성(시뮬레이션·GIS 등)을 방법과 결합"},{"k":"Skinner 프로그램 학습·Keller PSI","df":"프로그램 학습 4원리: 적극적 반응, 점진적 접근(작은 단계), 자기 속도, 즉각적 강화. Keller PSI: 완전학습(단원 숙달 후 진행), 자기 속도, 학습보조원(proctor)의 즉각 채점·피드백, 문자 자료 중심, 강의는 동기유발용","u":"작은 단위 온라인 과제 + 즉각 피드백, 숙달 확인 후 다음 단원"},{"k":"Bates SECTIONS 매체 선정","df":"Students(학습자 특성·접근성), Ease of use(사용 용이성), Cost(비용), Teaching functions(교수 기능), Interaction(상호작용), Organizational issues(조직 지원), Networking(연결성), Security·privacy(보안·개인정보)","u":"원격·온라인 수업 플랫폼 선정 점검표로 활용"},{"k":"learning from vs with technology","df":"learning from: 테크놀로지가 지식을 전달하는 교사·튜터 역할(학습자는 수용자). learning with: 테크놀로지가 학습자의 인지적 도구(마인드툴, Jonassen)가 되어 학습자가 지식을 구성","u":"학생이 GIS·스프레드시트로 자료를 분석해 산출물을 만들게 함"},{"k":"디지털 격차·보조공학","df":"디지털 격차: 1차 접근 격차(기기·인터넷) → 2차 활용 격차(역량) → 3차 성과 격차. 보조공학: 장애 학생의 접근을 보장하는 기기·서비스(화면 낭독기, 대체 입력장치, 자막), 보편적 학습설계(UDL)와 연결","u":"기기 대여·디지털 소양 교육, 자막·대체 텍스트 제공"}],"l22":"디지털 기초소양 강조, 디지털·AI 학습 환경, 학생 맞춤형 → 매체 선정(SECTIONS), learning with, 디지털 격차 해소","core":"매체는 무엇을(경험의 원추) · 어떻게 소통하고(SMCR) · 효과는 방법인가 매체인가(Clark/Kozma) · 어떻게 고르고(SECTIONS) · 누구도 소외 없이(격차·보조공학)"},{"id":"k_match","d":"2022 개정","g":"S","n":"2022 지문 단서 → 이론 인출 매칭","src":"핵심정리 §4","f":[{"k":"깊이 있는 학습·핵심 아이디어","df":"→ 백워드(영속적 이해), 학문중심(지식의 구조·나선형), 통합성·수직적 연계성","u":""},{"k":"삶과 연계·학생 주도성·참여형","df":"→ 경험중심·중핵형, Jonassen CLE, PBL, 자기조절, 자기결정성","u":""},{"k":"학생 맞춤형·선택권·고교학점제","df":"→ Snyder 생성 관점, 다중지능, 능력·성장참조, CAT, 비계","u":""},{"k":"디지털 기초소양·디지털 환경","df":"→ 온라인 상호작용, 위키·게시판, 플립드·블렌디드","u":""},{"k":"과정 중심 평가","df":"→ 형성평가 피드백, 수행·자기평가, 루브릭(신뢰도), 이원목적분류표(타당도)","u":""},{"k":"자율화·분권화·학교자율시간·학습공동체","df":"→ Skilbeck, Walker, PLC·동료장학, 변혁적·분산적 지도성, 학교운영위원회","u":""},{"k":"진로연계·자유학기","df":"→ 수직적 연계성, 학교중심 교육과정, Holland·Super","u":""}],"l22":"","core":"지문 단서를 보면 이론을 꺼내는 연결 문장","hot":1},{"id":"aol","n":"학습의 평가·학습을 위한 평가·학습으로서의 평가(Earl)","d":"교육평가","g":"S","src":"권지수 특강 유인물(Earl 2003) / 2022 평가 원칙","f":[{"k":"학습의 평가(AoL)","df":"학습 결과를 측정해 성취 수준을 판단(총괄평가 성격). 핵심 질문: 얼마나 배웠는가? 주체: 주로 교사. 활용: 점수·서열·도달 여부로 성적 산출·등급·진학·선발","u":"단원평가·학기말 시험으로 성취도 판정"},{"k":"학습을 위한 평가(AfL)","df":"교수·학습 과정 중 평가 정보로 교수·학습을 개선하고 학습을 촉진(형성평가 성격). 학습 수준과 목표 사이의 차이(gap)를 줄임. 핵심 질문: 어떻게 더 잘 배우게 할 것인가? 주체: 주로 교사, 학생도 참여. 활용: 구체적·정보적 피드백, 교수 전략 수정, 보충·개별화 지도","u":"수업 중 오개념 파악 → 즉각 피드백·추가 설명"},{"k":"학습으로서의 평가(AaL)","df":"학생이 평가 과정에 주도적으로 참여하며 자신의 학습을 점검·조절하는 능력을 기르는 평가. 목적: 자기조절학습 능력 함양. 핵심 질문: 스스로 어떻게 학습을 점검하고 조절할 것인가? 주체: 학생 중심, 교사는 촉진·지원. 활용: 루브릭 기반 자기평가·동료평가·성찰일지로 스스로 오류 수정","u":"평가기준표로 자기 글을 점검하고 수정 계획 세우기"}],"core":"결과 판정(AoL) / 개선 지원(AfL) / 스스로 조절(AaL) — 서로 배타적 유형이 아니라 하나의 평가 활동에서 함께 실현될 수 있는 관점","hot":1},{"id":"creat","n":"창의성 구성요소·창의성 개발 기법","d":"교육심리","g":"S","src":"권지수 특강 체크리스트 / 교재 표준(Guilford·Torrance, Osborn, Gordon, de Bono)","f":[{"k":"구성요소(인지적)","df":"유창성(많은 아이디어), 융통성(다양한 범주·관점), 독창성(새롭고 독특함), 정교성(세부를 다듬어 발전), 민감성(문제를 발견하는 예민함), 조직성(재구성·재정의)","u":"사고 유형별 발문 설계"},{"k":"브레인스토밍(Osborn)","df":"4원리: 비판 금지, 자유분방, 질보다 양(양산), 결합과 개선","u":"모둠별 아이디어 쏟아내기 후 평가는 나중에"},{"k":"시네틱스(Gordon)","df":"서로 관련 없어 보이는 것을 결합해 낯선 것을 친숙하게, 친숙한 것을 낯설게. 유추 4가지: 직접 유추, 의인 유추, 상징적 유추, 환상적 유추","u":"'내가 하천이라면?'(의인 유추)"},{"k":"PMI(de Bono)","df":"아이디어의 좋은 점(Plus), 나쁜 점(Minus), 흥미로운 점(Interesting)을 차례로 따져 성급한 판단을 막음","u":"정책 대안 평가"},{"k":"6색 사고모자(de Bono)","df":"흰색-사실·정보, 빨간색-감정·직관, 검은색-비판·위험, 노란색-긍정·이점, 초록색-창의·새 대안, 파란색-사고 과정 통제(사회자)","u":"역할을 바꿔 쓰며 토론"},{"k":"속성열거법·체크리스트(SCAMPER)","df":"속성열거: 대상의 속성을 낱낱이 나열해 개선점 찾기. 체크리스트(Osborn)/SCAMPER: 대체·결합·적용·수정(확대·축소)·다른 용도·제거·재배열(뒤집기) 질문 목록","u":"제품 개선 아이디어"}],"core":"구성요소는 '무엇을 기르나', 기법은 '어떻게 기르나' — 판별은 장면의 핵심 동작(쏟아내기/유추/장단점·흥미/색깔 역할/속성 나열/질문 목록)","hot":1,"mn":["자양비결 = 자유분방·양 추구·비판 금지·결합 개선(브레인스토밍 4원리)","백·적·흑·황·녹·청 = 객관(사실)·감정·부정(비판)·긍정·창의·사고에 대한 사고(6색 모자)"]},{"id":"teff","n":"교사효능감·교사기대","d":"교육심리","g":"S","src":"권지수 특강 체크리스트 / 교재 표준(Ashton & Webb, Rosenthal & Jacobson)","f":[{"k":"교사효능감","df":"자신이 학생의 학습과 행동에 긍정적 변화를 일으킬 수 있다는 교사의 신념","u":"자기 수업 성찰"},{"k":"높은 vs 낮은 교사효능감","df":"높음: 학생 실패를 자신의 교수 책임으로 귀속해 방법을 바꾸고, 저성취 학생에게도 기대·인내, 도전적 과제. 낮음: 실패를 학생 능력·가정 배경 탓으로 돌리고 쉽게 포기, 통제 위주","u":"실패 원인 귀속을 보고 판별"},{"k":"증진 방안","df":"효능감 4원천 활용(성공적 수업 경험, 동료 수업 관찰=대리 경험, 동료·관리자의 격려=언어적 설득, 스트레스·불안 관리=정서 상태) + 전문성 신장(연수·전문적 학습공동체·수업 컨설팅)","u":"작은 성공 수업 → 동료 수업 참관 → 협의회 지지"},{"k":"교사기대 효과","df":"자성예언(피그말리온 효과): 높은 기대가 학생 수행을 높임. 골렘 효과: 낮은 기대가 수행을 낮춤. 기대유지 효과: 학생이 변해도 교사가 기존 기대를 유지해 변화가 막힘","u":"모든 학생에게 도전적 기대·균등한 발문 기회"}],"core":"교사 신념(효능감)과 기대가 학생 성취로 이어진다 — 실패 원인 귀속과 기대 수준이 판별 단서","hot":1},{"id":"mlink","n":"동기이론 연결: 학습된 무기력·기대가치·자기가치·Maslow","d":"교육심리","g":"S","src":"권지수 특강 / 교재 표준(Seligman, Eccles & Wigfield, Covington, Maslow)","f":[{"k":"학습된 무기력","df":"반복된 실패를 통제할 수 없다고 지각해, 노력해도 소용없다고 믿고 시도 자체를 포기하는 상태. 처방: 귀인 변경(능력 → 노력 → 전략 귀인), 자기효능감 원천(성취 경험), 완전학습(충분한 시간·교정 학습), 준거참조·성장참조 평가","u":"작은 성공 경험 + 전략 피드백"},{"k":"기대가치 이론","df":"동기 = 성공 기대 × 과제 가치. 성공 기대에 영향: 목표, 과제 난이도 지각, 자기도식(자기개념), 정서적 기억. 과제 가치: 내재적 가치(흥미), 획득 가치(중요성), 효용 가치(유용성), 비용","u":"효용 가치 = 진로·삶과 연결해 보여 주기"},{"k":"자기가치 이론","df":"사람은 유능하다는 자기가치를 지키려 하며, 실패가 능력 부족으로 보일까 봐 자기장애 전략(미루기, 일부러 노력 안 하기, 비현실적 목표, 핑계)을 씀. 처방: 능력보다 노력·향상 평가, 실수 허용 분위기","u":"상대 비교 줄이고 향상 인정"},{"k":"Maslow 욕구위계","df":"결핍 욕구(생리, 안전, 소속·애정, 존중) → 성장 욕구(자아실현). 하위 욕구가 충족되어야 상위 욕구가 동기가 됨","u":"안전·소속감 있는 학급이 학습 동기의 전제"}],"core":"원인 진단(무기력·자기가치·결핍) → 처방(귀인·효능감·가치·평가)으로 이어 쓰기","hot":1,"mn":["내중효비 = 내재적 흥미·중요성(획득가치)·효용가치·비용","변비미소 = 실패 원인 변명·비현실적 목표·미루기·소극적 학습(자기장애 전략)"]},{"id":"cstyle","n":"인지양식(장독립·장의존, 충동·숙고)","d":"교육심리","g":"A","src":"권지수 특강 체크리스트 / 교재 표준(Witkin, Kagan)","f":[{"k":"장독립형","df":"주변 맥락에 영향을 덜 받고 분석적으로 지각, 내적 동기·스스로 구조화, 개별 학습 선호","u":"자기주도 탐구 과제"},{"k":"장의존형","df":"전체 맥락 속에서 지각, 사회적 정보에 민감, 외적 강화와 구조화된 지도 선호, 협동 선호. 지도: 외적 동기(칭찬·피드백), 구조화된 자료·명확한 안내, 협동학습","u":"단계별 안내지, 모둠 활동"},{"k":"충동형","df":"반응이 빠르지만 오류가 많음(Kagan 같은 그림 찾기 검사). 지도: 자기교시 훈련(Meichenbaum: 스스로 말하며 단계 점검), 답하기 전 숙고 시간","u":"풀이 전 '먼저 조건을 읽자' 혼잣말"},{"k":"숙고형","df":"반응이 느리지만 정확. 지도: 시간 관리, 어려운 문항 건너뛰고 나중에 풀기","u":"제한 시간 연습"}],"core":"특성 → 맞춤 지도 방안으로 바로 잇기"},{"id":"merrill","n":"Merrill 내용요소제시이론(CDT)","d":"교수·공학","g":"A","src":"권지수 특강 체크리스트 / 교재 표준","f":[{"k":"내용 × 수행 행렬","df":"내용 유형 4(사실·개념·절차·원리) × 수행 수준 3(기억·활용·발견). 사실은 기억만 해당","u":"목표를 행렬 칸으로 분류 후 제시형 결정"},{"k":"1차 제시형","df":"일반성 설명(법칙을 말해 줌), 사례 설명(예를 보여 줌), 일반성 탐구(법칙을 학습자가 진술), 사례 탐구(학습자가 예에 적용)","u":"원리 활용 목표 → 일반성 설명 + 사례 설명 + 사례 탐구"},{"k":"2차 제시형","df":"1차 제시형을 정교화하는 보조 자료: 맥락, 선수학습, 기억술, 도움말, 표현법(표상), 피드  잠재적 교육과정’ 답안의 문장을 서론 → 본론 → 결론 순서로 배열하세요.","seq":["박 교사는 학생들이 규칙에 수동적으로만 순응하는 모습을 고민하고 있다. 이에 교육과정과 학교 조직 측면에서 논하고자 한다.","먼저 이는 잠재적 교육과정으로, 학교가 의도하지 않았지만 학교생활을 통해 은연중에 학습되는 가치와 태도이다.","Jackson에 따르면 군집성, 평가(상찬), 권력이 이러한 학습의 원천이 된다.","다음으로 학교 조직 측면에서 교장은 교사에게 재량권을 주는 분산적 지도성을 발휘해 학교 문화를 함께 점검해야 한다.","이상에서 잠재적 교육과정과 지도성 측면의 방안을 살펴보았다. 학생이 주체적으로 배우는 학교 문화를 만들어 갈 것이다."],"role":["서론","본론 논점","본론 근거","본론 논점","결론"],"a":"서론 / 본론 논점 / 본론 근거 / 본론 논점 / 결론","src":"연습 답안 채점표 검토 · 교재 표준(논술 답안 작성 원칙)","hj":1,"h":["문장 5개 · 서론 1 → 본론 → 결론 1"],"wd":"월"},{"id":"wto2","k":"wt","s":"ord","t":"구조 배열","c":"sbcd","d":"교육과정","g":"S","q":"‘학교자율시간 과목 개발’ 답안의 문장을 서론 → 본론 → 결론 순서로 배열하세요.","seq":["A 중학교는 학교자율시간에 지역 연계 과목을 개설하려 한다. 이에 교육과정 개발과 평가 측면에서 논하고자 한다.","먼저 Skilbeck의 학교중심 교육과정 개발 모형은 상황 분석에서 출발한다.","따라서 교사는 학생의 요구와 지역사회의 가치 같은 내적·외적 요인을 먼저 분석해야 한다.","다음으로 평가 측면에서 교사는 성취기준에 근거해 루브릭을 만들어 수행평가의 신뢰도를 확보해야 한다.","이상에서 학교자율시간 과목의 개발과 평가 방안을 살펴보았다. 학교 구성원이 함께 숙의하며 교육과정을 만들어 갈 것이다."],"role":["서론","본론 논점","본론 근거","본론 논점","결론"],"a":"서론 / 본론 논점 / 본론 근거 / 본론 논점 / 결론","src":"연습 답안 채점표 검토 · 교재 표준(논술 답안 작성 원칙)","hj":1,"h":["문장 5개 · 서론 1 → 본론 → 결론 1"],"wd":"월"},{"id":"wto3","k":"wt","s":"ord","t":"구조 배열","c":"org","d":"교육행정","g":"S","q":"‘이완결합 조직과 지도성’ 답안의 문장을 서론 → 본론 → 결론 순서로 배열하세요.","seq":["B 고등학교는 교사들이 서로 고립된 채 수업하는 문제를 겪고 있다. 이에 학교 조직과 장학 측면에서 논하고자 한다.","먼저 학교는 구성원의 자율성이 큰 이완결합체제의 특성을 지닌다.","이러한 특성 때문에 교장은 통제보다 비전을 공유하는 문화적·변혁적 지도성을 발휘해야 한다.","다음으로 장학 측면에서 교사들은 서로의 수업을 관찰하고 협의하는 동료장학에 참여해야 한다.","이상에서 조직 특성에 맞는 지도성과 장학 방안을 살펴보았다. 동료와 함께 성장하는 교사가 될 것이다."],"role":["서론","본론 논점","본론 근거","본론 논점","결론"],"a":"서론 / 본론 논점 / 본론 근거 / 본론 논점 / 결론","src":"연습 답안 채점표 검토 · 교재 표준(논술 답안 작성 원칙)","h":["문장 5개 · 서론 1 → 본론 → 결론 1"],"wd":"수"},{"id":"wto4","k":"wt","s":"ord","t":"구조 배열","c":"vr","d":"교육평가","g":"S","q":"‘평가의 타당도와 신뢰도’ 답안의 문장을 서론 → 본론 → 결론 순서로 배열하세요.","seq":["최 교사는 단원평가 결과가 학생의 실제 이해를 반영하지 못한다고 느낀다. 이에 평가의 타당도와 신뢰도 측면에서 논하고자 한다.","먼저 타당도 측면에서 교사는 이원목적분류표를 작성해 내용타당도를 높여야 한다.","이원목적분류표는 교육목표와 내용을 고르게 반영하게 하기 때문이다.",  아이디어를 중심으로 지식·이해, 과정·기능, 가치·태도의 내용 요소를 유기적으로 연계하여 깊이 있는 학습을 하도록 한다. 핵심 아이디어는 과목 학습을 통해 학생들이 핵심적으로 성취하기를 기대하는 것으로, 교수·학습의 주요 내용이 된다.\n**지리 영역의 핵심 아이디어**: 지리 현상을 인식하고 자연환경과 인문환경이 인간 생활에 미치는 영향과 상호 작용을 파악하며 지속가능한 세계를 위해 협력하고 실천하는 시민의 자질을 함양하도록 구성되었다.\n**연결(교재 표준)**: 소수의 핵심 개념으로 교과 내용을 재구조화한다는 점에서 개념 중심 나선형 교육과정과 같은 발상이며, 2015 개정의 핵심개념이 2022 개정에서 문장형 핵심 아이디어로 바뀌었다.\n**시사점(교재 표준)**: 교사는 핵심 아이디어를 수업 단위로 구체화할 때 Taba의 다섯 기준으로 점검할 수 있다. 타당성과 유의미성은 학문적 대표성과 설명력을, 적합성은 학생의 필요·흥미·성숙도를 고려한 학습량 적정화를, 지속성은 오래 남는 이해를, 균형성은 학년 간 계열과 연계성을 점검하게 해 준다.","e":"2022 개정 사회과 교육과정(별책 7) · 2022개정_정리.md 총론 Ⅱ-2 · 연결과 시사점은 교재 표준","hl":"Taba 핵심개념 선정 기준","t":"2022 연계","ckw":[],"cmp":null,"basis":"B등급 · 지리교육학 교재 p.55 · 전공 연계","r":626,"h":["답의 뼈대 네 덩어리 — ① 2022 개정의 방향: 암기 대신 무엇을 중심으로 지식·이해, 과정·기능, 가치·태도를 연계하나 ② 지리 영역의 그 요소가 담은 내용(지리 현상 인식, 자연·인문환경과 인간 생활, 지속가능한 세계) ③ 연결: Taba가 교과를 소수의 핵심 개념으로 재구조화한 발상이 2022에서 어떤 문장형 요소로 이어졌나 ④ 시사점: Taba의 다섯 선정 기준으로 수업 단위를 점검","다섯 기준이 각각 무엇을 점검하게 하는지 — 학문적 대표성·설명력 / 학생의 필요·흥미·성숙도 / 오래 남는 이해 / 학년 간 계열과 연계."],"x22":1,"wd":"월"},{"id":"v4tabam1208","k":"mcq","c":"taba","d":"교육과정","g":"B","q":"[핵심개념 선정 회의] 김 교사: \"'입지'는 지리학에서 중요한 개념이긴 해요. 그런데 ㉠ 중학교 1학년 학생들의 필요와 흥미, 성숙도를 생각하면 지금 단계에서 그대로 가르치기는 어렵지 않을까요?\"\n\n밑줄 친 발언이 근거로 삼은 Taba의 핵심개념 선정 기준은?","a":"적합성","x":["타당성","유의미성","지속성"],"why":{"타당성":"그 개념이 도출되는 학문 분야의 개념들을 적절하게 대표할 수 있는가?를 묻는 기준.","유의미성":"그 개념이 세계의 중요한 부분(현상)들을 잘 설명할 수 있는가?를 묻는 기준.","지속성":"그 개념의 중요성이 오랫동안 지속되는가?를 묻는 기준."},"e":"㉠은 학생의 필요, 흥미, 성숙도에 적합하게 가르칠 수 있는가를 물으므로 적합성이다. (사례는 교재 표준)","hl":"Taba 핵심개념 선정 기준","hj":0,"h":["발언이 묻는 질문을 다섯 기준의 질문과 맞춰 보세요."],"wd":"월","hx":[null]},{"id":"v4tabam1209","k":"mcq","c":"taba","d":"교육과정","g":"B","q":"[핵심개념 선정 회의] 박 교사: \"요즘 유행하는 특정 앱 이름을 개념처럼 다루자는 의견이 있는데요, ㉠ 몇 년만 지나도 의미가 없어질 내용이라 핵심개념으로 삼기는 어렵다고 봐요.\"\n\n밑줄 친 발언이 근거로 삼은 Taba의 핵심개념 선정 기준은?","a":"지속성","x":["타당성","유의미성","적합성"],"why":{"타당성":"그 개념이 도출되는 학문 분야의 개념들을 적절하게 대표할 수 있는가?를 묻는 기준.","유의미성":"그 개념이 세계의 중요한 부분(현상)들을 잘 설명할 수 있는가?를 묻는 기준.","적합성":"그 개념이 학생의 필요, 흥미, 성숙도에 적합하게 가르칠  학생들이 수업 시간에 질문도 안 하고 시키는 것만 하는 것 같아요.\" 최 교사: \"여럿이 함께 지내다 보니 차례를 기다리는 데 익숙해지고, 늘 점수로 평가받다 보니 틀릴까 봐 나서지 않는 것 같아요.\" — 학생들의 수동적 태도를 잠재적 교육과정 측면에서 진단하고, 이를 고려한 교사의 노력 1가지를 논하시오.","model":"학생들의 수동적 태도는 잠재적 교육과정 측면에서 진단할 수 있다. 잠재적 교육과정은 학교가 의도하지 않았지만 학교생활을 통해 학생이 은연중에 배우는 가치와 태도이다. Jackson에 따르면 학생들은 군집성을 경험하면서 공동의 이익을 위해 자기 욕구를 억제하고 기다리는 것을 배우므로, 은연중에 순응적이고 소극적인 학습 태도를 형성할 수 있다. 또한 평가를 반복적으로 경험하면서 틀리는 것을 두려워해 발표와 질문을 피하게 될 수 있다. 따라서 교사는 평가로 인한 잠재적 교육과정을 고려해 수업해야 하며, 예를 들어 오답을 허용하는 형성적 피드백 중심의 평가를 운영하여 학생이 부담 없이 질문하도록 할 수 있다.","kw":[["잠재적 교육과정"],["은연중"],["Jackson","잭슨"],["군집성"],["평가","상찬"],["순응","소극"]],"need":4,"e":"강의 4~5주차 · 발문이 불완전하면 기출 표현의 경계 안에서 답(진단 = 학자·개념·원천·은연중 + 보완)","hj":1,"h":["모범 답안 1문장(핵심어 가림) — 학생들의 수동적 태도는 ○○ 측면에서 진단할 수 있다.","모범 답안 2문장(핵심어 가림) — ○○은 학교가 의도하지 않았지만 학교생활을 통해 학생이 ○○에 배우는 가치와 태도이다.","모범 답안 3문장(핵심어 가림) — ○○에 따르면 학생들은 ○○을 경험하면서 공동의 이익을 위해 자기 욕구를 억제하고 기다리는 것을 배우므로, ○○에 ○○적이고 ○○적인 학습 태도를 형성할 수 있다."],"wd":"월","hot":1},{"id":"v4hidk1219","k":"card","c":"hid","d":"교육과정","g":"S","q":"영 교육과정의 범위에 '가르치지 않은 것' 외에 포함되는 것과, 영 교육과정의 긍정적 측면은?","a":"범위: 가르쳐야 하는데 가르치지 않은 것뿐 아니라 **소홀히(불충분하게) 가르친 것**도 포함한다. 긍정적 측면: 바람직하지 않은 내용(예: **식민사관**)을 의도적으로 배제하는 것은 오히려 긍정적일 수 있다.","e":"강의 3주차 · 예시는 강의","hl":null,"t":"핵심 인출","ckw":[],"cmp":null,"basis":"S등급 · 논술 기출 2014·2019·2020·2024년 · 객관식 기출 약 7문항 · 출제표 4회","r":707,"hj":1,"h":["수업 장면 — 교육내용 선정 시 빠진 내용이 없는지 반성, 새 요구(기후·디지털·다양성) 포함","헷갈리는 짝과 구별 — 잠재적 교육과정은 학생이 실제로 \"배운다\"(주로 정의적 결과) — 예: 학교 문화, 칭찬·벌, 군집·권력 → 태도 형성","답의 뼈대(핵심어 가림) — 범위: 가르쳐야 하는데 가르치지 않은 것뿐 아니라 ○○도 포함한다. 긍정적 측면: 바람직하지 않은 내용(예: ○○)을 의도적으로 배제하는 것은 오히려 긍정적일 수 있다."],"wd":"월","hot":1},{"id":"v4hidk1220","k":"card","c":"hid","d":"교육과정","g":"S","q":"공식적 교육과정과 잠재적·영 교육과정은 어떤 관계이며, 잠재적·영 교육과정을 공식적 교육과정의 '그림자'라고 부르는 이유는?","a":"공식적 교육과정이 있는 한 잠재적 교육과정과 영 교육과정은 **항상 함께 나타나며 결코 0이 될 수 없기** 때문이다. 빙산 비유: 공식적 = 의식(수면 위), 잠재적 = 전의식, 영 = 잠재의식의 맨 아래.\n**함께 정리** — 공식적(표면적) 교육과정에서 잠재적·영 교육과정이 발생함","e":"강의 3주차","hl":null,"t":"핵심 인출","ckw":[],"cmp":null,"basis":"S등급 · 논술 기출 2014· 심)","hl":null,"t":"핵심 인출","ckw":[],"cmp":null,"basis":"S등급 · 논술 기출 2014·2016·2020·2023년 · 객관식 기출 약 42문항 · 출제표 7회","r":726,"hj":1,"h":["수업 장면 — 체계적 지식 전달(비판: 흥미 무시)","헷갈리는 짝과 구별 — 경험중심(Dewey)은(는) 개념: 학습자의 흥미·필요와 생활 문제를 해결하는 경험을 중심으로 한 교육과정(Dewey: \"경험의 재구성\", 행함으로써 배운다) 장점: 학습 흥미 유발, 전인적 발달, 문제해결력 신장 단점: 기초학력 저하, 교과 지식의 체계성 부족, 교사의 준비 부담","답의 뼈대(핵심어 가림) — ① ○○: 고대 그리스·로마 고전을 모방하며 인간성(이상형)을 추구. ② ○○: 교과와 교사를 중시하고 ○○ 전달을 강조(7자유학과 계승). ③ ○○: 교양·고전(The Great Books) 중심으로 Aristoteles가 말한 ○○을 강조(엘리트화 우려 → 파이데이아 제안이 반대). 인류 태동기부터 있던 교과중심을 후대 학자들이 이렇게 수렴해 정의했다. 논술에는 나오지 않는 배경 지식이다."],"wd":"월"},{"id":"v4expk1237","k":"card","c":"exp","d":"교육과정","g":"A","q":"형식도야설의 핵심을 기출 문장으로 정리하면? 교과의 중요성은 어디에 있으며, 어떤 교수 방법과 전이를 가정하는가?","a":"\"교과의 중요성은 구체적인 **내용**에 있기보다 내용을 담은 **형식**에 있다.\" 7자유학과 속에 정신능력(기억력, 주의력, 의지력, 추리력)을 기르는 **형식**이 들어 있으므로, 무엇을 기억하고 추리하느냐가 아니라 기억하고 추리한다는 점이 중요하다. 교수 방법은 **훈련과 반복**이고, 길러진 능력이 여러 특수 분야로 **일반적으로 전이**된다고 가정한다. 흥미가 없는 교과라도 학습자의 **노력**이 중시된다. 함정: '교과 내용의 가치를 개인 생활의 의미와 사회적 유용성에서 찾는다'는 **경험중심** 문장이다.\n**함께 정리** — 정신능력(부소능력, 형식)이 개발되어 다른 영역으로 전이됨","e":"강의 7주차·9주차 객관식 해설 · 사서삼경과 정약용 예시는 강의","hl":null,"t":"핵심 인출","ckw":[],"cmp":null,"basis":"S등급 · 논술 기출 2014·2016·2020·2023년 · 객관식 기출 약 42문항 · 출제표 7회","r":727,"hj":1,"h":["답의 뼈대(핵심어 가림) — \"교과의 중요성은 구체적인 ○○에 있기보다 내용을 담은 ○○에 있다.\" 7자유학과 속에 정신능력(기억력, 주의력, 의지력, 추리력)을 기르는 ○○이 들어 있으므로, 무엇을 기억하고 추리하느냐가 아니라 기억하고 추리한다는 점이 중요하다. 교수 방법은 ○○이고, 길러진 능력이 여러 특수 분야로 ○○된다고 가정한다. 흥미가 없는 교과라도 학습자의 ○○이 중시된다. 함정: '교과 내용의 가치를 개인 생활의 의미와 사회적 유용성에서 찾는다'는 ○○ 문장이다. / ○○ — 정신능력(부소능력, 형식)이 개발되어 다른 영역으로 전이됨"],"wd":"월","merged":["v4expk1003"],"hot":1},{"id":"v4expk1238","k":"card","c":"exp","d":"교육과정","g":"B","q":"형식도야와 대비되는 실질도야란 무엇이며, 어떤 이론과 비슷한가?","a":"**실질도야**는 교과의 **내용** 자체를 강조한다. 해당 내용을 알고 있어야 그와 비슷한 다른 일도 할 수 있다고 본다. 그래서 Thorndike의 **동일요소설**과 비슷하다. 형식도야는 내용 속 **형식**을 익혀 정신능력을 기른다고 본다. (도야: Locke 원문은 쇠를 두드려 연마하는 것, 사전은 쇠를 녹여 주조하는 것)","e":"강의 7주차 · 교재 표준","hl":null,"t":"핵심 인출","ckw":[],"cmp":null,"basis":"S등급 · 논술 기출 2014·2016·2020·2023년 · 객 ,"k":"card","c":"exp","d":"교육과정","g":"S","q":"2021 논술(Snyder)에서 모범 답안: 충실도 관점의 장점·단점과, 생성 관점의 교육과정 운영 방안 2가지는?","a":"충실도 관점: 장점은 **전국적인 교육의 질을 보장**할 수 있다는 것, 단점은 **개별 학교의 특수성과 학생의 요구**에 부합하는 교육과정을 운영하기 어렵다는 것이다. 생성 관점 운영 방안: ① 국가 교육과정, 교과서, 수업 전략 등 외부에서 만들어진 자료를 **도구로만 활용**하고 교사와 학생이 함께 교육과정을 만들어 간다 ② 교사를 교육과정의 **수용자가 아니라 창조자**로 보고, 단위학교의 특수성과 학생의 요구에 맞게 교육 내용을 **창의적으로 만들어** 가르친다. 두 방안 모두 객관식 기출 문장(2007 Snyder 객관식)과 김대현 교재 문장에서 나왔다.","e":"강의 9주차 2021 논술 해설","hl":null,"t":"핵심 인출","ckw":[],"cmp":null,"basis":"S등급 · 논술 기출 2014·2016·2020·2023년 · 객관식 기출 약 42문항 · 출제표 7회","r":733,"hj":1,"h":["답의 뼈대(핵심어 가림) — 충실도 관점: 장점은 ○○할 수 있다는 것, 단점은 ○○에 부합하는 교육과정을 운영하기 어렵다는 것이다. 생성 관점 운영 방안: ① 국가 교육과정, 교과서, 수업 전략 등 외부에서 만들어진 자료를 ○○하고 교사와 학생이 함께 교육과정을 만들어 간다 ② 교사를 교육과정의 ○○로 보고, 단위학교의 특수성과 학생의 요구에 맞게 교육 내용을 ○○ 가르친다. 두 방안 모두 객관식 기출 문장(2007 Snyder 객관식)과 김대현 교재 문장에서 나왔다."],"wd":"월","hot":1},{"id":"v4expk1244","k":"card","c":"exp","d":"교육과정","g":"S","q":"Bruner가 말한 '지식의 구조'를 한 문장으로 정의하면? 어떤 조건을 갖춰야 지식의 구조로서 교육 내용이 될 수 있는가?","a":"지식의 구조는 지식의 단순한 집합(더미)이 아니라 **지식과 정보를 서로 관련짓고 체계화하게 하는 기본 개념, 일반적 원리, 핵심 아이디어**이다. 조건: 그 개념과 원리가 **현실에서 활용될 수 있어야** 비로소 지식의 구조가 된다(시소·저울·선박과 항공기의 평형처럼). 기출 표현: 교과의 구조란 각 교과가 모태로 삼는 학문의 기본 아이디어·개념·원리이며, 기본적이고 일반적이므로 **단순**하여 **어린 나이에도 학습 가능**하고 새 문제에 대한 적용 범위가 넓다.","e":"강의 7주차·9주차 · 2009 중등 객관식 지문","hl":null,"t":"핵심 인출","ckw":[],"cmp":null,"basis":"S등급 · 논술 기출 2014·2016·2020·2023년 · 객관식 기출 약 42문항 · 출제표 7회","r":734,"hj":1,"h":["개념 틀 — 흥미·생활(경험) vs 구조·탐구(학문)","답의 뼈대(핵심어 가림) — 지식의 구조는 지식의 ○○한 집합(더미)이 아니라 ○○이다. 조건: 그 개념과 원리가 ○○ 비로소 지식의 구조가 된다(시소·저울·선박과 항공기의 평형처럼). 기출 표현: 교과의 구조란 각 교과가 모태로 삼는 학문의 기본 아이디어·개념·원리이며, 기본적이고 일반적이므로 ○○하여 ○○하고 새 문제에 대한 적용 범위가 넓다."],"wd":"월","hot":1},{"id":"v4expk1245","k":"card","c":"exp","d":"교육과정","g":"S","q":"학문중심 교육과정의 기반 학습이론인 형태이조설은 무엇이며, 나선형 조직과 어떻게 연결되는가? 나선형에서 계열성보다 더 강조되는 것은?","a":"**형태이조설**: 학습 자료의 **역학적 구조**를 이해하면 다른 학습으로 전이된다(초등 시소의 평형 → 중등 저울·천칭 → 고등·산업 현장의 선박과 항공기의 평형). **나선형 조직**: 같은 개념(평형)이 학년이 올라갈수록 **심화·확대**되는 조직이다. 더 강조되는 것은 ** "],"wd":"월","merged":["v4expk1144"],"hot":1},{"id":"v4expk1248","k":"card","c":"exp","d":"교육과정","g":"A","q":"교육과정 사조의 흐름에서 각 사조가 바뀐 계기를 순서대로 정리하면? (교과중심 → 경험중심 → 학문중심 → 인간중심)","a":"교과중심(인류 태동기~1930년대, 형식도야설) → 1930년대 Thorndike **동일요소설**의 형식도야 비판, Dewey·진보주의가 흡수 → **경험중심**(1930~50년대) → 기초학력 저하(반지성주의), 시간 경제성 저하, Dewey 자신의 비판으로 쇠퇴 → 1957 **Sputnik 충격**, Woods Hole 회의(Bruner) → **학문중심**(1960~70년대) → 과도한 경쟁, 교사 배제, 분과주의 심화, 베트남전·히피 문화·인종 문제 → **인간중심**(1970년대~, 자아실현, 잠재적 교육과정, 비인간화 비판) → 재개념주의 → 1980년대 **파이데이아 제안**(모든 학생에게 균등한 교육, 엘리트 교육 반대 → 우리의 국민공통기본교육과정)과 **기준 운동**(내용기준·수행기준 → 성취기준, 벤치마크).","e":"강의 5주차 흐름 강의","hl":null,"t":"핵심 인출","ckw":[],"cmp":null,"basis":"S등급 · 논술 기출 2014·2016·2020·2023년 · 객관식 기출 약 42문항 · 출제표 7회","r":738,"hj":1,"h":["수업 장면 — 핵심 개념을 학년마다 깊이·폭을 넓혀 반복, 탐구 수업","헷갈리는 짝과 구별 — 경험중심(Dewey)은(는) 학습자의 \"경험·흥미\" — 예: \"행함으로써 배운다\", 생활 문제, 중핵형"],"wd":"월","hot":1},{"id":"v4expk1249","k":"card","c":"exp","d":"교육과정","g":"B","q":"교육과정 구성의 역사에서 Bobbitt 이전과 이후 학자들의 기여를 정리하면? (Spencer, McMurry 형제, Bobbitt, Newlon, Caswell)","a":"**Spencer**: 근대적 교육과정 논의를 처음 제기('어떤 지식이 가장 가치로운가', 과학적 지식, 지식의 우선순위에서 건강 관련 지식을 1순위, 여가 활동 지식은 마지막). **McMurry 형제**: 교과마다, 수업마다 적합한 교수 방법이 있다. **Bobbitt**(1918 『The Curriculum』): 교육과정 **구성의 과학화**, 성인 생활의 **직무 분석**(과학적 관리론과 연결). 주의: Bobbitt의 '구성의 과학화'와 Spencer의 '과학적 지식'은 다르다. **Newlon**(Denver 교육장): **교사가 교육과정 개발에 참여**해야 한다. **Caswell**: 교육과정 개발은 **수업 개선**을 위한 것이며 교사에게 **최신 지식**을 제공해야 한다(총론이 개정 사항을 안내하고 문서에 교수·학습 및 평가 방향을 싣는 이유).","e":"강의 4~5주차 · 교재 표준(홍후조·김대현 계열)","hl":null,"t":"핵심 인출","ckw":[],"cmp":null,"basis":"S등급 · 논술 기출 2014·2016·2020·2023년 · 객관식 기출 약 42문항 · 출제표 7회","r":739,"hj":1,"h":["학자별 단서 — Spencer: '어떤 지식이 가장 가치 있는가'를 처음 물었다 / McMurry 형제: 교수 방법에 관한 주장 / Bobbitt: 1918년 책, 성인 생활을 분석해 교육과정을 '과학적으로' 구성 / Newlon: 덴버 교육장, 누가 교육과정 개발에 참여해야 하나 / Caswell: 교육과정 개발의 목적은 무엇이고 교사에게 무엇을 줘야 하나","함정 — Bobbitt의 '과학화'는 구성 방법의 과학화이고, Spencer의 '과학'은 가치 있는 지식의 내용(과학적 지식)이다."],"wd":"월"},{"id":"v4expk1250","k":"card","c":"exp","d":"교육과정","g":"B","q":"재 ,"q":"[조건] 다문화교육의 개념 1가지와 다문화 학생이 있는 학급에서의 수업 방안 2가지를 쓰시오. 아래 틀에 직접 채워 쓰시오.","tpl":"(본론 첫 문장) ___를 위해서는 ___ 측면에서 ___해야 한다.\n용어는 ___이다. 그 개념은 ___이다.\n방안은 다음 2가지이다. 첫째, ___. 둘째, ___.","a":"모든 학생을 위한 포용적 교육을 위해서는 교육사회 측면에서 다문화교육을 실시해야 한다. 용어는 다문화교육이다. 그 개념은 다양한 문화적 배경을 가진 학생이 평등한 교육 기회를 누리고 서로의 문화를 존중하도록 하는 교육이다. 방안은 다음 2가지이다. 첫째, 다양한 문화의 사례를 교육 내용에 통합하여 편견과 고정관념을 줄인다. 둘째, 학생의 문화적 배경을 고려한 문화 감응적 교수를 실시하여 모든 학생이 학습에 참여하게 한다.","ex":"Banks의 내용 통합, 편견 감소, 공평한 교수법과 연결된다.","src":"교재 표준 개념 + 엄정석 논술 작성법 형식(조건 그대로, 용어→개념→방안 첫째·둘째)","h":["형식: 용어는 ~이다 → 그 개념은 ~이다 → 첫째·둘째","조건에 나온 표현을 그대로 반복"],"wd":"금"},{"id":"v4apprk1268","k":"card","c":"appr","d":"교수·공학","g":"S","q":"인지적 도제 수업에서 교사가 '방금 그 문제를 왜 그렇게 풀었는지 친구들에게 설명해 보자'라고 할 때, 이 단계의 명칭과 개념은? 이 단계를 행동주의 용어로 설명하면 왜 틀리는가?","a":"**명칭**: 명료화(articulation)\n**개념**: 학생이 자신의 지식, 추론, 문제해결 과정을 말이나 글로 표현하여 드러내게 하는 단계\n**위치**: 모델링 → 코칭 → 스캐폴딩 → 명료화 → 반성 → 탐구 중 스캐폴딩 다음 단계\n**행동주의로 쓰면 틀리는 이유**: 인지적 도제는 전문가의 보이지 않는 사고 과정을 외현화하여 익히는 인지적·상황학습 모형이다. '강화', '반복 연습으로 행동 형성'처럼 쓰면 사고 과정의 외현화라는 핵심이 빠져 채점기준에 맞지 않는다.\n**답안 원칙**: 명칭(명료화)을 반드시 먼저 쓴다. 설명이 맞아도 명칭이 없으면 0점이다.","e":"자체 2회 모의고사 오답 보강 · 교재 표준","hl":"명료화","t":"사례 판별","ckw":["명료화","말이나 글로 표현","사고 과정","외현화"],"cmp":null,"basis":"S등급 · 논술 기출 2020년 · 객관식 기출 약 22문항","r":272,"hj":1,"h":["수업 장면 — 시범 → 순회 힌트 → 힌트 카드 회수 → 설명하게 하기 → 비교 성찰 → 새 문제 탐구","스캐폴딩 다음 단계"],"wd":"화","hot":1},{"id":"v4refk1269","k":"card","c":"ref","d":"교육평가","g":"S","q":"'이전 점수와 비교해 얼마나 좋아졌는지'로 해석하는 평가와, 고등학교에서 성취기준 도달 정도에 따라 A~E 등급을 주는 평가제도는 각각 무엇이며 어떻게 다른가?","a":"**성장참조평가**: 학생의 이전 성취와 현재 성취를 비교해 얼마나 향상되었는지로 결과를 해석하는 평가 참조틀\n**성취평가(성취평가제)**: 성취기준에 도달한 정도에 따라 성취수준(A~E)을 부여하는 제도로, 해석 기준은 준거참조평가(절대평가)이다\n**차이**: 성장참조평가는 '자기 자신의 과거'와 비교하고, 성취평가는 '미리 정한 성취기준'과 비교한다\n**답안 원칙**: 지문에 '이전보다 향상', '성장 정도'가 나오면 성장참조평가로 쓴다. 성취평가로 쓰면 0점이다.","e":"자체 2회 모의고사 오답(성장참조평가를 성취평가로 씀) 보강 · 교재 표준","hl":"성장참조","t":"비교(빈출)","ckw":[],"cmp":{"h":["성장참조평가","성취평가(성취평가제)"],"r":[["비교 대상","학생 자신의 이전 성취","미리 정한 성취기준"],["해석 방식","향상 정도","성취기준 도달 정도(A~E 성취수준)"],["참조틀","성장참조","준거참조(절대평가)"],["지문 단서","이전보다, 향상, 성장","성취기준, 성취수준, 최소 성취수준 보장"]]},"basis":"S등급 · 논술 기출 2015·2018·2022·2024·2025년 · 객관식 기출 약 19문항","r":115,"hj":1,"h":["개념 틀 — 남과 비교(규준) / 기준과 비교(준거) / 내 능력과(능력) / 과거 나와(성장)","하나는 참조틀, 하나는 제도"],"wd":"수","hot":1},{"id":"pat_um16","k":"pat","c":"phil","d":"상담·사회·철학","g":"S","t":"엄정석 틀 채우기","q":"[조건] Peters의 자유교육(교육의 개념) 관점에서 교육의 내재적 가치 개념 1가지와 이를 반영한 수업 방안 2가지를 쓰시오. 아래 틀에 직접 채워 쓰시오.","tpl":"(본론 첫 문장) ___를 위해서는 ___ 측면에서 ___해야 한다.\n용어는 ___이다. 그 개념은 ___이다.\n방안은 다음 2가지이다. 첫째, ___. 둘째, ___.","a":"진정한 배움의 즐거움을 위해서는 교육철학 측면에서 교육의 내재적 가치를 추구해야 한다. 용어는 내재적 가치이다. 그 개념은 교육이 취업이나 시험 같은 외적 목적의 수단이 아니라 지식과 이해 그 자체를 추구하는 데서 오는 가치라는 것이다. 방안은 다음 2가지이다. 첫째, 학생이 개념을 왜 배우는지 스스로 탐구하며 이해의 폭과 깊이를 넓히도록 탐구 중심 수업을 한다. 둘째, 점수와 보상 대신 지식의 형식이 주는 의미와 즐거움을 느끼도록 학생의 지적 호기심에서 출발하는 질문을 수업의 중심에 둔다.","ex":"Peters의 교육 개념 준거: 규범적 준거(가치 있는 것의 전수), 인지적 준거(지식·이해·인지적 안목), 과정적 준거(도덕적으로 온당한 방법).","src":"교재 표준 개념 + 엄정석 논술 작성법 형식(조건 그대로, 용어→개념→방안 첫째·둘째)","h":["형식: 용어는 ~이다 → 그 개념은 ~이다 → 첫째·둘째","조건에 나온 표현을 그대로 반복"],"wd":"금"},{"id":"v4vrk1270","k":"card","c":"vr","d":"교육평가","g":"S","q":"고전검사이론에서 문항의 질을 분석하는 세 가지 지표는 무엇이며, 각각 무엇을 보는가?","a":"**문항난이도** — 전체 응답자 중 정답자의 비율(P = 정답자 수 ÷ 전체 응답자 수). 값이 클수록 쉬운 문항\n**문항변별도** — 능력이 높은 학생과 낮은 학생을 구별하는 정도(상위 집단 정답률 − 하위 집단 정답률). 값이 클수록 변별력이 높음\n**오답지 매력도** — 각 오답지가 정답을 모르는 학생을 끌어들이는 정도. 기준: (1 − P) ÷ (답지 수 − 1) 이상이면 매력적인 오답지\n**함께 정리** — 고전검사이론의 문항 지수는 응답 집단이 바뀌면 달라진다(집단 의존적). 문항반응이론은 집단과 관계없이 문항 특성이 일정하다고 본다(문항 불변성, CAT의 기반).","e":"교재 표준(고전검사이론 문항분석) · 사용자 질문(학습조직, 고전 문항검사 세 가지) 반영","hl":null,"t":"전체 구조","ckw":["문항난이도","문항변별도","오답지 매력도"],"cmp":null,"basis":"S등급 · 논술 기출 2017·2019·2023년 · 객관식 기출 약 49문항","r":758,"h":["개념 틀 — 얼마나 쉬운가 / 잘하는 학생과 못하는 학생을 가르는가 / 틀린 보기가 제 역할을 하는가","자체 6회 모의고사에서 변별도·오답지 매력도를 물었다"],"wd":"수","hj":1,"hot":1},{"id":"v4vrk1271","k":"card","c":"vr","d":"교육평가","g":"S","q":"응답자 100명 중 정답자가 80명인 문항의 문항난이도 지수와 그 해석은? 이 지수가 가리키는 문항 분석 지표의 명칭은?","a":"**문항난이도**(문항 곤란도) — P = 80 ÷ 100 = **0.80**. 값이 클수록 쉬운 문항이므로 **쉬운 문항**으로 해석한다. 일반적으로 0.3~0.7 정도를 적절한 난이도로 보며, 0.5 근처에서 변별도가 가장 커질 수 있다(교재 표준).","e":"","hl":null,"t":"핵심 인출","ckw":["문항난이도"],"cmp":null,"basis":"S등급 · 논술 기출 2017·2019·2023년 · 객관식 기출 약 49문항","r":759,"h":["정답자 비율이 높다는 것은 쉽다는 뜻이다. '곤란도'라는 이름과 값의 방향이 반대인 점에 주의"],"wd":"수","hj":1,"hot":1},{"id":"v4vrk1272","k":"card","c":"vr","d":"교육평가","g":"S","q":"상위 집단 20명 중 18명, 하위 집단 20명 중 6명이 맞힌 문항이 있다. 이 문항이 능력이 높은 학생과 낮은 학생을 구별하는 정도를 나타내는 지표의 명칭과 값, 그리고 하위 집단이 더 많이 맞힌 문항은 어떻게 처리하는가?","a":"**문항변별도** — DI = (18 − 6) ÷ 20 = **0.60** → 변별력이 높은 문항. 변별도 지수는 −1.0~+1.0이며, 0.40 이상이면 매우 양호, 0.30대는 양호, 0.20대는 수정이 필요하고 0.20 미만은 변별력이 낮다(Ebel 기준, 교재 표준). 하위 집단이 더 많이 맞힌 **부적 변별도** 문항은 정답·문항 진술에 문제가 있으므로 수정하거나 제거한다.","e":"","hl":null,"t":"핵심 인출","ckw":["문항변별도","부적 변별도"],"cmp":null,"basis":"S등급 · 논술 기출 2017·2019·2023년 · 객관식 기출 약 49문항","r":760,"h":["(상위 집단 정답자 수 − 하위 집단 정답자 수) ÷ 한 집단의 인원"],"wd":"수","hj":1,"hot":1},{"id":"v4vrk1273","k":"card","c":"vr","d":"교육평가","g":"S","q":"사지선다 문항의 정답률이 0.40일 때, 어떤 오답지가 '매력적인 오답지'로 인정되려면 그 오답지를 고른 비율이 얼마 이상이어야 하는가? 이 지표의 명칭은?","a":"**오답지 매력도** — 기준 = (1 − P) ÷ (답지 수 − 1) = (1 − 0.40) ÷ (4 − 1) = **0.20**. 오답지를 고른 비율이 0.20 이상이면 매력적인 오답지, 미만이면 정답을 모르는 학생도 끌어들이지 못하는 오답지이므로 수정한다. 또 상위 집단이 하위 집단보다 더 많이 고른 오답지는 정답 시비가 있을 수 있어 점검한다.","e":"","hl":null,"t":"핵심 인출","ckw":["오답지 매력도"],"cmp":null,"basis":"S등급 · 논술 기출 2017·2019·2023년 · 객관식 기출 약 49문항","r":761,"h":["틀린 학생의 비율(1 − P)을 오답지 수로 똑같이 나눈 값이 기준이 된다"],"wd":"수","hj":1,"hot":1},{"id":"v4lok1274","k":"card","c":"lo","d":"교육행정","g":"S","q":"학교를 학습조직으로 만들자고 할 때, Senge의 학습조직과 전문적 학습공동체는 어떤 관계이며 각각 무엇을 강조하는가?","a":"**학습조직**(Senge) — 조직 전체가 지속적으로 학습하여 스스로 변화하는 조직. 구축 원리: 개인적 숙련, 정신모형, 공유비전, 팀학습, 시스템 사고\n**전문적 학습공동체** — 학습조직의 한 유형. 교사들이 공유 비전 아래 협력적으로 탐구하고, 수업을 공개·성찰하며, 학생 학습에 공동 책임을 지는 교사 공동체\n**함께 정리** — 기출 지문 표현: '학습조직의 한 유형인 전문적 학습공동체'. 앞의 것을 물으면 Senge의 원리로, 뒤의 것을 물으면 공유 비전·협력적 탐구·공동 책임으로 쓴다.","e":"사용자 질문(학습조직) 반영 · 교재 표준","hl":null,"t":"비교(빈출)","ckw":["학습조직","전문적 학습공동체"],"cmp":null,"basis":"S등급 · 논술 기출 2015·2020년 · 객관식 기출 약 6문항","r":762,"h":["하 q":"창의성의 인지적 구성요소를 모두 쓰고 각각의 뜻을 말하면?","a":"**유창성**: 주어진 시간 안에 많은 아이디어를 산출\n**융통성**: 다양한 범주·관점으로 바꾸어 생각\n**독창성**: 새롭고 독특한(드문) 아이디어\n**정교성**: 아이디어를 세부적으로 다듬어 발전\n**민감성**: 문제와 주변 변화를 예민하게 발견\n**조직성**: 정보를 새롭게 재구성·재정의(교재 표준: 교재에 따라 '재정의'로 표기)","h":["분류 단서 — 양 / 범주의 다양함 / 드묾 / 세부 다듬기 / 문제 발견 / 재구성","장면 단서 — '아이디어 수를 세어 보자'는 어떤 요소?"],"wd":"목","t":"구성요소","hot":1,"e":"교재에 따라 4요소(유창성·융통성·독창성·정교성)만 제시하기도 한다.","basis":"교재 표준(Guilford·Torrance) / 특강 메모"},{"id":"v28creatk2","k":"card","c":"creat","d":"교육심리","g":"S","q":"학생들이 '벽돌의 쓰임'을 답할 때 집짓기·담장·화단처럼 같은 용도만 여러 개 쓴 경우와, 문진·악기·운동기구처럼 서로 다른 종류로 바꾸어 쓴 경우 각각 높은 창의성 요소는?","a":"**같은 종류를 많이** → **유창성**(아이디어의 양)\n**서로 다른 범주로 바꿈** → **융통성**(범주·관점의 다양성)\n함께 정리: 남들이 거의 쓰지 않은 답은 독창성, 한 아이디어를 구체적으로 다듬으면 정교성","h":["판별 단서 — 개수를 세나, 범주를 세나"],"wd":"목","t":"판별","hot":1,"basis":"교재 표준"},{"id":"v28creatk3","k":"card","c":"creat","d":"교육심리","g":"S","q":"모둠이 아이디어를 낼 때 남의 생각을 평가하지 않고, 엉뚱한 생각도 환영하며, 가능한 한 많이 내고, 남의 아이디어를 이어 붙여 발전시키는 기법의 명칭과 4원리는?","a":"**브레인스토밍**(Osborn)\n① **비판 금지**(판단 보류): 아이디어 산출 중 평가하지 않음\n② **자유분방**: 엉뚱한 아이디어도 환영\n③ **질보다 양**(양산): 많이 낼수록 좋은 아이디어가 나올 확률이 높음\n④ **결합과 개선**: 다른 사람의 아이디어를 결합·발전","h":["장면 단서 — 쏟아내기, 평가는 나중에","원리 단서 — 판단 / 자유 / 양 / 이어 붙이기"],"wd":"목","t":"구성요소","hot":1,"basis":"교재 표준(Osborn)"},{"id":"v28creatk4","k":"card","c":"creat","d":"교육심리","g":"S","q":"'내가 하천이라면 비가 많이 올 때 어떤 기분일까?'처럼 서로 관련 없어 보이는 것을 유추로 연결하는 기법의 명칭과 유추 4가지는?","a":"**시네틱스**(Gordon): 낯선 것을 친숙하게, 친숙한 것을 낯설게 만드는 유추 기법\n① **직접 유추**: 실제 사물·현상을 직접 비교(우산 ↔ 박쥐 날개)\n② **의인 유추**: 자신이 대상이 되어 봄(내가 하천이라면)\n③ **상징적 유추**: 두 단어의 모순·상징으로 압축 표현(조용한 폭풍)\n④ **환상적 유추**: 현실 제약을 벗어난 상상(중력이 없다면)","h":["판별 단서 — 비교하기 / 되어 보기 / 모순된 상징 / 비현실적 상상"],"wd":"목","t":"구성요소","hot":1,"basis":"교재 표준(Gordon)"},{"id":"v28creatk5","k":"card","c":"creat","d":"교육심리","g":"S","q":"대안 하나를 놓고 좋은 점, 나쁜 점, 흥미로운 점을 차례로 적게 하는 기법과, 사실·감정·비판·긍정·창의·사고 통제의 역할을 색깔로 나누어 맡게 하는 기법의 명칭은?","a":"**PMI**(de Bono): Plus(좋은 점) → Minus(나쁜 점) → Interesting(흥미로운 점). 성급한 판단을 막고 아이디어를 다각도로 평가\n**6색 사고모자**(de Bono)\n흰색: 객관적 사실·정보\n빨간색: 감정·직관\n검은색: 비판·위험·약점\n노란색: 긍정·이점\n초록색: 창의·새 대안\n파란색: 사고 과정 통제(사회자, 정리)","h":["판별 단서 — 세 칸 표 / 색깔별 역할","색 단서 — 숫자와 사실은 종이색, 열정은 불색, 신중한 판사는 법복색"],"wd":"목","t":"구성요소","hot":1,"basis":"교재 표준(de Bono)"},{"id":"v28creatk6","k":"card","c":"creat","d":"교육심리","g":"S","q":"대상의 특성을 모양·재료·기능별로 낱낱이 나열한 뒤 하나씩 바꾸어 보는 기법과, '다른 것으로 대체하면? 합치면? 다른 용도로 쓰면? 빼면? 뒤집으면?' 같은 질문 목록을 쓰는 기법의 명칭은?","a":"**속성열거법**(Crawford): 대상의 속성(명사적·형용사적·동사적 속성)을 나열하고 각 속성을 개선\n**체크리스트법**(Osborn) / **SCAMPER**(Eberle): 대체(S)·결합(C)·적용(A)·수정·확대·축소(M)·다른 용도(P)·제거(E)·재배열·뒤집기(R)","h":["판별 단서 — 특성 나열 / 질문 목록 점검"],"wd":"목","t":"구성요소","hot":1,"basis":"교재 표준"},{"id":"v28creatk7","k":"card","c":"creat","d":"교육심리","g":"A","q":"창의성 개발 수업에서 교사가 지켜야 할 원리를 브레인스토밍·평가 측면에서 정리하면?","a":"**판단 보류**: 아이디어 산출 단계와 평가 단계를 분리\n**허용적 분위기**: 실수·엉뚱한 생각을 존중(심리적 안전)\n**확산적 사고 발문**: 정답이 여럿인 열린 질문\n**평가**: 결과뿐 아니라 유창성·융통성·독창성·정교성을 기준으로 과정 평가(교재 표준)","h":["분위기 단서 — 틀려도 괜찮은 교실","발문 단서 — 답이 여러 개인 질문"],"wd":"목","t":"방안","hot":1,"basis":"교재 표준"},{"id":"v28teffk1","k":"card","c":"teff","d":"교육심리","g":"S","q":"자신이 학생의 학습과 행동에 긍정적 변화를 일으킬 수 있다는 교사의 신념을 무엇이라 하며, 이 신념이 높은 교사와 낮은 교사는 학생의 실패를 각각 어디에 귀속하는가?","a":"**교사효능감**: 자신의 교수 행위가 학생의 학습과 행동을 변화시킬 수 있다는 교사의 신념\n**높은 교사**: 학생의 실패를 자신의 **교수 책임**으로 귀속 → 교수 방법을 바꾸고, 저성취 학생에게도 기대와 인내, 도전적 과제 제시\n**낮은 교사**: 실패를 학생의 **능력·가정 배경** 탓으로 귀속 → 쉽게 포기, 통제·훈육 위주","h":["판별 단서 — '내가 다르게 가르치면 된다' vs '저 아이는 원래 안 된다'"],"wd":"목","t":"구성요소","hot":1,"basis":"교재 표준(Ashton & Webb) / 특강 체크리스트"},{"id":"v28teffk2","k":"card","c":"teff","d":"교육심리","g":"S","q":"교사효능감을 높이는 방안을 Bandura 효능감 원천과 전문성 신장으로 나누어 쓰면?","a":"**효능감 원천 활용**\n성취 경험: 작은 단위의 성공적 수업 경험 축적\n대리 경험: 비슷한 경력 동료의 수업 관찰\n언어적 설득: 동료·관리자의 격려와 구체적 피드백\n정서 상태: 수업 불안·스트레스 관리\n**전문성 신장**: 연수, 전문적 학습공동체, 수업 컨설팅으로 교수 역량 강화","h":["범주 단서 — 신념의 원천 4 / 역량을 키우는 지원","장면 단서 — 동료 수업 참관은 어떤 원천?"],"wd":"목","t":"방안","hot":1,"basis":"교재 표준 / 특강 메모(효능감 원천 → 교사효능감)"},{"id":"v28teffk3","k":"card","c":"teff","d":"교육심리","g":"S","q":"교사기대 효과 세 가지(자성예언, 골렘 효과, 기대유지 효과)를 구별하면?","a":"**자성예언**(피그말리온 효과, Rosenthal & Jacobson): 교사의 높은 기대가 학생의 실제 수행을 높임\n**골렘 효과**: 교사의 낮은 기대가 학생의 수행을 낮춤\n**기대유지 효과**: 학생이 실제로 변화해도 교사가 기존 기대를 유지해 학생의 변화 가능성을 막음\n방안: 모든 학생에게 도전적 기대, 발문·대기시간·피드백을 고르게 제공, 기대를 주기적으로 점검","h":["판별 단서 — 높은 기대의 결과 / 낮은 기대의 결과 / 변화 무시"],"wd":"목","t":"구성요소","hot":1,"basis":"교재 표준 / 특강 메모"},{"id":"v28mlinkk1","k":"card","c":"mlink","d":"교육심리","g":"S","q":"반복된 실패 끝에 '해도 안 된다'며 시도조차 하지 않는 상태의 명칭과, 이를 벗어나게 하는 처방을 서로 다른 범주로 쓰면?","a":"**학습된 무기력**(Seligman): 실패를 통제할 수 없다고 지각해 노력해도 소용없다고 믿고 포기하는 상태\n처방(범주별)\n**귀인 변경**: 능력 부족 귀인 → 노력·전략 부족 귀인(통제 가능)\n**자기효능감**: 작은 성공의 성취 경험, 또래 모델의 대리 경험\n**수업 운영**: 완전학습처럼 충분한 시간과 교정 학습 제공\n**평가**: 준거참조·성장참조 평가로 향상과 도달을 확인","h":["범주 단서 — 원인 해석 / 할 수 있다는 믿음 / 시간과 교정 / 비교 기준","연결 단서 — 귀인 이론, Bandura, Bloom, 평가 참조틀"],"wd":"목","t":"연결","hot":1,"basis":"특강 메모 / 교재 표준"},{"id":"v28mlinkk2","k":"card","c":"mlink","d":"교육심리","g":"S","q":"기대가치 이론에서 성공 기대에 영향을 주는 요인과 과제 가치의 4요소는?","a":"**동기 = 성공 기대 × 과제 가치**(Eccles & Wigfield)\n**성공 기대에 영향**: 목표, 과제 난이도 지각, 자기도식(자기개념), 정서적 기억\n**과제 가치**\n내재적 가치(흥미): 과제 자체의 즐거움\n획득 가치(중요성): 자기 정체성에 중요함\n효용 가치(유용성): 미래 목표·진로에 쓸모\n비용: 과제를 위해 포기하는 것(시간·노력·불안)","h":["가치 단서 — 재미 / 나에게 중요 / 쓸모 / 치르는 대가","곱셈 단서 — 하나가 0이면 동기도 0"],"wd":"목","t":"구성요소","hot":1,"basis":"특강 메모 / 교재 표준"},{"id":"v28mlinkk3","k":"card","c":"mlink","d":"교육심리","g":"A","q":"유능해 보이고 싶은 마음에 시험 전날 일부러 공부하지 않거나 핑계를 마련하는 행동을 설명하는 이론과 그 전략의 명칭은?","a":"**자기가치 이론**(Covington): 사람은 유능하다는 자기가치를 지키려 함\n**자기장애 전략**(자기보호 전략): 미루기, 일부러 노력하지 않기, 비현실적으로 높은 목표, 실패 핑계 만들기 → 실패해도 능력 부족으로 보이지 않게 함\n처방: 능력이 아닌 노력·향상을 평가, 상대 비교 축소, 실수를 학습 기회로 보는 분위기","h":["장면 단서 — '공부 안 해서 못 본 거야'라는 핑계를 미리 만들기"],"wd":"목","t":"구성요소","hot":1,"basis":"교재 표준 / 특강 메모"},{"id":"v28mlinkk4","k":"card","c":"mlink","d":"교육심리","g":"A","q":"Maslow 욕구위계에서 결핍 욕구와 성장 욕구는 무엇이며, 학습 동기와 어떻게 연결되는가?","a":"**결핍 욕구**: 생리 → 안전 → 소속·애정 → 존중\n**성장 욕구**: 자아실현(교재에 따라 지적 욕구·심미적 욕구 포함)\n원리: 하위 욕구가 충족되어야 상위 욕구가 동기가 됨\n연결: 안전하고 소속감 있는 학급, 존중받는 경험이 학습 동기의 전제","h":["순서 단서 — 몸 → 안전 → 관계 → 인정 → 성장"],"wd":"목","t":"구성요소","hot":1,"basis":"교재 표준 / 특강 메모"},{"id":"v28cstylek1","k":"card","c":"cstyle","d":"교육심리","g":"A","q":"전체 맥락에 영향을 많이 받고 사회적 정보에 민감한 학생의 인지양식과, 이 학생을 위한 지도 방안 3가지는?","a":"**장의존형**(Witkin): 전체 맥락 속에서 지각, 사회적 정보·타인 반응에 민감, 외적 강화와 구조화된 지도 선호\n지도 방안\n**동기**: 칭찬·피드백 등 외적 동기 제공\n**자료**: 구조화된 자료와 명확한 단계 안내\n**학습 형태**: 협동학습\n(장독립형: 분석적 지각, 내적 동기, 스스로 구조화, 개별 탐구 선호)","h":["대비 단서 — 숨은 그림을 잘 못 찾는 쪽"],"wd":"목","t":"구성요소","basis":"교재 표준 / 특강 체크리스트"},{"id":"v28cstylek2","k":"card","c":"cstyle","d":"교육심리","g":"A","q":"문제에 빨리 답하지만 오류가 많은 학생과, 느리지만 정확한 학생의 인지양식과 각각의 지도 방안은?","a":"**충동형**(Kagan): 반응 빠름·오류 많음 → **자기교시 훈련**(Meichenbaum: 과제 단계를 스스로 말하며 점검), 답하기 전 숙고 시간\n**숙고형**: 반응 느림·정확 → 시간 관리 연습, 어려운 문항은 **건너뛰고** 나중에 풀기","h":["지도 단서 — 혼잣말로 단계 점검 / 넘어가고 돌아오기"],"wd":"목","t":"구성요소","basis":"교재 표준 / 특강 메모"},{"id":"v28ipk1","k":"card","c":"ip","d":"교육심리","g":"A","q":"부호화할 때의 맥락과 인출할 때의 맥락이 일치할수록 기억이 잘 인출된다는 원리의 명칭과 수업 시사점은?","a":"**부호화 특수성 원리**(Tulving)\n시사점: 지식을 실제로 쓰일 맥락에서 학습하게 함 → **상황학습**·실제적 과제와 연결, 평가 맥락과 학습 맥락을 맞춤","h":["연결 단서 — 지식은 쓰일 곳에서 배워야 꺼내 쓸 수 있다"],"wd":"목","t":"연결","hot":1,"basis":"교재 표준 / 특강 메모"},{"id":"v28ipk2","k":"card","c":"ip","d":"교육심리","g":"A","q":"메타인지의 지식 측면 3변인과 기능 측면 4가지, 그리고 '이해했다고 착각하는 현상'의 명칭은?","a":"**메타인지 지식**(Flavell): 개인 변인(나의 인지 특성), 과제 변인(과제의 성격·난이도), 전략 변인(어떤 전략이 효과적인지)\n**메타인지 기능**: 계획 → 점검 → 조절 → 평가\n**이해의 착각**: 실제로 이해하지 못했는데 이해했다고 믿는 현상 → 백지 인출, 자기 설명, 자기 점검 질문으로 확인","h":["지식 단서 — 나 / 과제 / 방법","기능 단서 — 세우고 살피고 고치고 돌아보기"],"wd":"목","t":"구성요소","hot":1,"basis":"교재 표준 / 특강 메모"},{"id":"v28ipk3","k":"card","c":"ip","d":"교육심리","g":"A","q":"작업기억의 용량 한계를 극복하는 방법 두 가지와, 부호화 전략 중 '실제 상황에 넣어 익히기'에 해당하는 전략은?","a":"**작업기억 한계 극복**\n청킹: 정보를 의미 있는 단위로 묶기\n자동화: 반복 연습으로 하위 기능을 자동적으로 처리해 작업기억 부담을 줄임\n**부호화 전략**: 정교화, 조직화, 심상, **맥락화**(실제 상황·맥락 속에서 학습)","h":["단서 — 묶기 / 손에 익히기"],"wd":"목","t":"구성요소","hot":1,"basis":"교재 표준 / 특강 메모"},{"id":"v28vygk1","k":"card","c":"vyg","d":"교육심리","g":"A","q":"효과적인 비계설정의 구성요소 5가지는?","a":"**공동 문제해결**: 교사와 학생이 함께 흥미 있는 과제를 해결\n** 히 갈고닦는다.\n• ㉡ '우리 학교 학생들은 원래 안 된다'는 고정된 생각을 드러내고 성찰한다.\n• ㉢ 문제를 한 부서 탓으로 보지 않고, 여러 요인이 얽힌 전체 구조 속에서 본다.\n• 또 학교의 미래상을 함께 만들고, 팀 단위 대화로 함께 배운다.","q":"(1) 이 학교가 지향하는 조직의 명칭을 쓰시오. (2) ㉠~㉢에 해당하는 Senge의 원리 명칭을 쓰시오.","el":[{"n":"(1) 조직","a":"학습조직","kw":[["학습조직","학습 조직"]],"x":""},{"n":"(2) ㉠","a":"개인적 숙련","kw":[["개인적 숙련"]],"x":""},{"n":"(2) ㉡","a":"정신모형","kw":[["정신모형","정신 모형"]],"x":""},{"n":"(2) ㉢","a":"시스템 사고","kw":[["시스템"]],"x":""}],"crit":"요소별 전부 아니면 0점: 공식 명칭이 아닌 일상어·비슷한 다른 개념은 0점. 방안 두 개를 요구하면 서로 다른 범주(예: 과제·평가·관계·환경)여야 각각 인정.","src":"기출 2015"},{"id":"r28p1","k":"ret","rd":"금","c":"mlink","d":"교육심리","g":"S","hot":1,"ctx":"[상담 기록]\n민수: 저는 머리가 나빠서 해도 안 돼요. 이번에도 망할 거예요.\n민수는 몇 번의 실패 뒤 ㉠ 과제를 시작조차 하지 않는다.\n교사 메모: 실패 원인을 바꾸어 보게 하고, 민수가 '할 수 있다'는 믿음을 갖게 해야겠다. 평가도 다른 학생과의 비교가 아닌 방식으로 바꿔야겠다.","q":"(1) ㉠ 상태의 명칭을 쓰시오. (2) 민수의 귀인을 어떤 방향으로 바꾸어야 하는지 쓰시오. (3) 자기효능감을 높이는 방안 1가지를 Bandura의 원천 명칭과 함께 쓰시오. (4) 평가 측면의 방안 1가지를 쓰시오. (단, (3)과 (4)는 서로 다른 범주)","el":[{"n":"(1) ㉠","a":"학습된 무기력(Seligman)","kw":[["무기력"]],"x":""},{"n":"(2) 귀인 변경","a":"능력(내적·안정·통제 불가) 귀인 → 노력·전략(내적·불안정·통제 가능) 귀인으로 바꾸는 귀인 재훈련","kw":[["노력","전략"]],"x":"'긍정적으로 생각하게'는 0점"},{"n":"(3) 효능감","a":"성공 경험(숙달 경험): 작은 단계 과제로 성공을 쌓게 한다 / 대리 경험 / 언어적 설득 / 정서 상태 중 원천 명칭 + 방안","kw":[["성공 경험","성공경험","숙달 경험","대리","언어적 설득","정서"]],"x":""},{"n":"(4) 평가","a":"준거참조평가나 성장참조평가로 자기 향상과 도달 여부를 보여 준다","kw":[["준거","성장","향상","자기 비교"]],"x":""}],"crit":"요소별 전부 아니면 0점: 공식 명칭이 아닌 일상어·비슷한 다른 개념은 0점. 방안 두 개를 요구하면 서로 다른 범주(예: 과제·평가·관계·환경)여야 각각 인정.","src":"녹음 요지(무기력 → 귀인변경 + 효능감 4원천 + 완전학습 + 준거참조) / 권지수 필기(귀인 Good: 노력)"},{"id":"r28p2","k":"ret","rd":"금","c":"mlink","d":"교육심리","g":"S","hot":1,"ctx":"[면담 기록]\n지윤: 이 단원은 제 진로와 아무 상관이 없어서 왜 배우는지 모르겠어요(ⓐ). 그리고 시험은 친구들보다 잘 봐서 무시당하지 않는 게 제일 중요해요(ⓑ).\n교사: 지윤이가 과제를 의미 있게 느끼고, 남과의 비교보다 자기 성장에 관심을 갖게 하고 싶다.","q":"(1) ⓐ를 설명하는 동기 이론의 명칭과, 그 이론에서 ⓐ 학생에게 낮게 나타난 하위 요소의 명칭을 쓰시오. (2) ⓑ의 목표지향성 유형 명칭을 쓰시오. (3) 숙달목표를 높이는 방안 2가지를 서로 다른 범주로 쓰시오.","el":[{"n":"(1) 이론","a":"기대×가치 이론(Eccles & Wigfield)","kw":[["기대","가치"]],"x":""},{" function mergeSt(c){if(!c||typeof c!=='object')return;migDup(c);const mx=(a,b)=>Math.max(a||0,b||0);st.wrAt=st.wrAt||{};st.wrDel=st.wrDel||{};
 const ca=c.wrAt||{},cd=c.wrDel||{};for(const k in ca)st.wrAt[k]=mx(st.wrAt[k],ca[k]);for(const k in cd)st.wrDel[k]=mx(st.wrDel[k],cd[k]);
 const ids=new Set(DATA.items.map(x=>x.id)),all=new Set([...Object.keys(st.wr),...Object.keys(c.wr||{})]);
 for(const k of all){if(!ids.has(k))continue;const n=mx(st.wr[k],(c.wr||{})[k]);if((st.wrAt[k]||1)>(st.wrDel[k]||0))st.wr[k]=n;else delete st.wr[k]}
 for(const k in (c.sr||{})){const a=st.sr[k],b=c.sr[k];if(!a||(b&&b.d>a.d))st.sr[k]=b}
 for(const k in (c.hist||{})){const a=st.hist[k]||{c:0,w:0},b=c.hist[k]||{};const h={c:mx(a.c,b.c),w:mx(a.w,b.w)};if(a.hc||b.hc)h.hc=mx(a.hc,b.hc);if(a.p||b.p)h.p=mx(a.p,b.p);st.hist[k]=h}
 for(const k in (c.days||{}))st.days[k]=mx(st.days[k],c.days[k]);
 for(const k in c)if(!(k in st))st[k]=c[k]}
async function onLogin(u){CL.msg='동기화 중…';cloudUI();try{const s=await fb.D.get(eduRef());const v=s.val();if(v&&v.p){try{mergeSt(JSON.parse(v.p))}catch(e){}}
  localStorage.setItem(LS,JSON.stringify(st));await cloudPush(true);await missBackfill();CL.msg='✅ 동기화됨';try{badge();if(VIEW==='home')home()}catch(e){}}
 catch(e){CL.msg='⚠️ 동기화 실패: '+(e.code||e.message);toast('동기화 실패 ['+(e.code||e.message)+']')}cloudUI()}
async function cloudPush(force){if(!fb||!CL.user)return;if(!force&&!CL.dirty)return;CL.dirty=false;
 await fb.D.set(eduRef(),{name:'교육학 퀴즈 앱(edu-quiz)',app:'edu',v:1,p:JSON.stringify(st),wrN:Object.keys(st.wr).length,seen:fb.D.serverTimestamp()});CL.last=Date.now();localStorage.setItem('edu_cloud_last',CL.last);cloudUI()}
var _cpT=null;window.cloudDirty=()=>{if(!CL.user)return;CL.dirty=true;cloudUI();clearTimeout(_cpT);_cpT=setTimeout(()=>cloudPush().catch(e=>{CL.msg='⚠️ 동기화 실패: '+(e.code||'');cloudUI()}),4000)};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&CL.dirty)cloudPush().catch(()=>{})});
// 오답 1건 = 실시간 로그(review/<uid>/misses, d:'edu'). 비로그인 시 대기열에 보관 후 로그인 때 업로드
function missObj(id){const x=ALLI.find(i=>i.id===id)||{};return {at:Date.now(),d:'edu',id:id,k:String(x.k||''),area:String(x.d||'').slice(0,60),q:String(x.q||'').replace(/<[^>]+>/g,'').slice(0,200),n:st.wr[id]||1}}
window.eduMiss=(id,lv)=>{st.wrAt=st.wrAt||{};st.wrAt[id]=Date.now();const o=missObj(id);if(lv)o.lv=lv;if(fb&&CL.user){fb.D.push(fb.D.ref(fb.rt,'review/'+CL.user.uid+'/misses'),o).catch(()=>{queueMiss(o)})}else queueMiss(o)};
function queueMiss(o){const q=JSON.parse(localStorage.getItem('edu_missq')||'[]');q.push(o);while(q.length>2000)q.shift();localStorage.setItem('edu_missq',JSON.stringify(q))}
async function missBackfill(){const q=JSON.parse(localStorage.getItem('edu_missq')||'[]');const first=!localStorage.getItem('edu_missbf');
 if(first){const now=Date.now();for(const id in st.wr)if(!q.some(o=>o.id===id)){const o=missObj(id);o.at=(st.wrAt&&st.wrAt[id])||now;o.how='backfill';q.push(o)}}
 if(!q.length){localStorage.setItem('edu_missbf','1');return}const u={};q.forEach((o,i)=>{u['e'+o.at+'_'+i+'_'+String(o.id).replace(/[.#$\/\[\]]/g,'_')]=o});
 await fb.D.update(fb.D.ref(fb.rt,'review/'+CL.user.uid+'/misses'),u);localStorage.setItem('edu_missq','[]');localStorage.setItem('edu_missbf','1');toast('오답 '+q.length+'건을 계정에 올렸어요')}
async function login(){try{await cloudLoad();const {Au}=fb,pv=new Au.GoogleAuthProvider();pv.setCustomParameters({prompt:'select_account'});
 try{const r=await Au.signInWithPopup(fb.auth,pv);if(r&&r.user)toast('✅ 로그인됨: '+(r.user.email||''))}catch(e){const c=e&&e.code||'';if(/popup-blocked|operation-not-supported|web-storage-unsupported/.test(c)){localStorage.setItem('edu_lpend','1');await Au.signInWithRedirect(fb.auth,pv)}else throw e}}
 catch(e){const c=(e&&e.code)||String(e);localStorage.removeItem('edu_lpend');toast('로그인 실패 ['+c+']');cloudUI()}}
async function logout(){if(!fb)return;try{await cloudPush(true)}catch(e){}await fb.Au.signOut(fb.auth);toast('로그아웃 — 이 기기의 기록은 그대로 남아요')}
function cloudState(){const u=CL.user;if(!u)return ['off',CL.st=='loading'&&localStorage.getItem('edu_fb')=='1'?'연결 중…':'로그인'];if(/실패/.test(CL.msg))return ['err','동기화 실패'];if(CL.dirty||/중/.test(CL.msg))return ['pend','동기화 대기'];return ['ok','동기화됨']}
function cloudUI(){let c=$('#authchip');if(!c){const t=$('#theme');if(!t)return;t.insertAdjacentHTML('beforebegin','<button id="authchip" class="achip" aria-label="계정 동기화"></button>');c=$('#authchip');c.onclick=()=>{if(!CL.user)login();else{CL.dirty=true;cloudPush(true).then(()=>{CL.msg='✅ 동기화됨';cloudUI();toast('✅ 동기화됨')}).catch(e=>{CL.msg='⚠️ 동기화 실패: '+(e.code||'');cloudUI()})}}}
 const [s,tx]=cloudState(),u=CL.user;c.className='achip '+s;c.title=u?'로그인됨 — 탭하면 지금 동기화':'탭해서 Google 로그인(전공퀴즈와 같은 계정)';c.innerHTML=(u?`<span class="av">${esc(((u.displayName||u.email||'나')+'').charAt(0))}</span>`:'')+`<span class="dot"></span><span class="tx">${tx}</span>`;
 const cc=$('#cloudCard');if(cc){cc.innerHTML=cloudCardHTML();bindCloudCard()}}
function cloudCardHTML(){if(!CL)return '<h2>☁️ 계정 동기화</h2>';const u=CL.user,hm=t=>t?new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}):'—';
 if(!u)return `<h2>☁️ 계정 동기화</h2><p class="mut" style="font-size:14px">전공퀴즈(지리)와 같은 Google 계정으로 로그인하면 오답·복습 기록이 기기 간에 합쳐지고, 매일 자정 이후 오답 검토에 쓰여요. 이 기기의 기존 기록은 지워지지 않고 계정에 합쳐져요.</p>${CL.st=='fail'?`<p class="mut">${esc(CL.msg)}</p>`:''}<button class="btn l" id="cLogin">Google로 로그인</button>`;
 return `<h2>☁️ 계정 동기화</h2><p style="font-size:14px">${esc(u.email||'로그인됨')}<br><span class="mut">${esc(CL.msg||'')} · 마지막 동기화 ${hm(CL.last)} · 오답 ${Object.keys(st.wr).length}개</span></p><button class="btn l" id="cSync">지금 동기화</button><button class="btn l" id="cOut">로그아웃</button>`}
function bindCloudCard(){const a=$('#cLogin'),b=$('#cSync'),o=$('#cOut');if(a)a.onclick=login;if(b)b.onclick=()=>{CL.dirty=true;cloudPush(true).then(()=>{CL.msg='✅ 동기화됨';cloudUI();toast('✅ 동기화됨')}).catch(e=>toast('동기화 실패 ['+(e.code||'')+']'))};if(o)o.onclick=logout}
cloudUI();if(localStorage.getItem('edu_fb')=='1'||localStorage.getItem('edu_lpend')=='1'||localStorage.getItem('gv_fb')=='1'){cloudLoad().then(()=>{if(localStorage.getItem('edu_lpend')=='1'){localStorage.removeItem('edu_lpend');return fb.Au.getRedirectResult(fb.auth).catch(e=>toast('로그인 실패 ['+(e.code||'')+']'))}}).catch(()=>{})}

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
