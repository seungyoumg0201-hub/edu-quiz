<style>
:root{--bg:#f5f0e6;--card:#fffdf8;--ink:#2f3a2f;--mut:#7a7f72;--g:#3f6b4a;--g2:#e3eddf;--line:#e2dccd;--bad:#b0492f;--badbg:#f8e6df;--warn:#a07a1e;--warnbg:#f7efd9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:22px 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
h1{font-size:20px;margin:0;color:var(--g)}h1 small{font-size:13px;color:var(--mut);font-weight:500;margin-left:6px}
a{color:var(--g)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:14px}
.btn{display:inline-block;border:0;border-radius:12px;background:var(--g);color:#fff;font-size:16px;font-weight:600;padding:12px 20px;cursor:pointer;text-decoration:none}
.btn.l{background:var(--g2);color:var(--g)}.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.big{font-size:34px;font-weight:700;color:var(--g)}.mut{color:var(--mut);font-size:14px}
.bar{height:8px;background:var(--g2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
table.ar{width:100%;border-collapse:collapse;font-size:14px}table.ar td{padding:6px 4px;border-bottom:1px solid var(--line)}
.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;background:var(--g2);color:var(--g);margin-right:6px}
.psg{background:#faf6ec;border-left:4px solid var(--g);border-radius:10px;padding:16px 18px;font-size:17px;margin:12px 0}
.q{font-weight:600;margin:12px 0 8px}
textarea{width:100%;min-height:190px;border:2px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:17px;background:#fff;resize:vertical}
textarea:focus{outline:none;border-color:var(--g)}
.res{border-radius:12px;padding:12px 16px;font-weight:700;margin:12px 0}.res.ok{background:var(--g2);color:var(--g)}.res.weak{background:var(--warnbg);color:var(--warn)}.res.no{background:var(--badbg);color:var(--bad)}
ul.ck{list-style:none;padding:0;margin:6px 0}ul.ck li{padding:4px 0}
.cue{background:#fff1a8;border-radius:4px;padding:0 2px}
.fb h4{margin:14px 0 4px;font-size:14px;color:var(--mut)}.model{background:#f3f7f1;border-radius:10px;padding:12px 14px}
.mn{background:#fbf3e2;border-radius:10px;padding:10px 14px}
kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;background:#fff;color:var(--mut)}
.sbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}.sbar .bar{flex:1}
@media(max-width:600px){.wrap{padding:14px 12px 50px}.card{padding:16px}.psg{font-size:16px}.big{font-size:28px}}
</style></head><body><div class="wrap">

<script>

if(!S.m36){K.filter(x=>x.pri).forEach(x=>{const s=S.k[x.i],n=nextPD(today());if(s&&n!==undefined&&s.due>n)s.due=n});S.m36=1;save()}
function areaRows(){const A={};K.forEach(x=>{const a=A[x.a]=A[x.a]||{n:0,m:0,s:0};a.n++;const s=S.k[x.i];if(s){a.s++;if(s.c>=2)a.m++}});
 return Object.entries(A).map(([k,a])=>`<tr><td>${k}</td><td style="width:45%"><div class="bar"><i style="width:${100*a.m/a.n}%"></i></div></td><td class="mut">${a.m}/${a.n} 숙달 · ${a.s} 학습</td></tr>`).join('')}
let Q=[],qi=0,cur=null,mode='day';
function home(){const p=plan(),m=K.filter(x=>(S.k[x.i]||{}).c>=2).length,sn=K.filter(x=>S.k[x.i]).length,dd=Math.ceil((new Date('2026-11-28T00:00:00+09:00')-Date.now())/864e5);
 const done=S.days[p.t]||0;
 app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><div class="mut">오늘의 세트 (${p.t<0?'11/20 시작':p.t>LAST?'시험 직전 복습':'회차 '+(p.t+1)+'/8일'})</div><div class="big">${p.set.length}문항</div><div class="mut">복습 ${p.due.length} · 새 키워드 ${p.nw.length} · 오늘 푼 문항 ${done} · 약 ${Math.round(p.set.length*1.2)}분</div></div>
 <div style="text-align:right"><div class="mut">시험까지</div><div class="big">D-${dd}</div></div></div>
 <div class="sbar" style="margin-top:14px"><div class="bar"><i style="width:${100*m/K.length}%"></i></div><span class="mut">숙달 ${m}/${K.length} · 학습 ${sn}/${K.length}</span></div>
 <div class="row" style="margin-top:16px"><button class="btn" id="go" ${p.set.length?'':'disabled'}>오늘 세트 시작<kbd>Enter</kbd></button><button class="btn l" id="rnd">자유 연습 10문항</button></div>
 ${p.set.length?'':'<p class="mut">오늘 할 문항을 다 풀었어요 👍 자유 연습으로 더 돌릴 수 있어요.</p>'}</div>
 <div class="card"><b>영역별 진행</b><table class="ar">${areaRows()}</table>
 <p class="mut" style="margin-top:12px">틀리면 다음 날, 개념명만 맞고 뜻·방안이 빠지면 2일 뒤, 다 맞으면 3일→4일 뒤 다시 나옵니다(11/27을 넘기지 않음). 모의고사 오답 키워드(⭐)는 11/21·23·25·27에 꼭 다시 나옵니다. 새 키워드 ${K.length}개는 11/20–23에 나눠 처음 보고, 11/24–27에 다른 지문으로 다시 봅니다. 숙달 = 연속 2회 정답.</p></div>`;
 $('#go').onclick=()=>{Q=p.set.slice();mode='day';qi=0;show()};$('#rnd').onclick=()=>{Q=[...K].sort(()=>Math.random()-.5).slice(0,10);mode='rnd';qi=0;show()}}
function show(){if(qi>=Q.length){home();return}const x=Q[qi],s=S.k[x.i]||{n:0},v=s.n%x.s.length,{t}=sc(x,v);cur={x,v,done:false};
 app.innerHTML=`<div class="sbar"><div class="bar"><i style="width:${100*qi/Q.length}%"></i></div><span class="mut">${qi+1} / ${Q.length}</span><a href="#" id="hm" class="mut">홈</a></div>
 <div class="card"><span class="chip">${x.a}</span>${s.n?'<span class="chip">복습</span>':'<span class="chip">새 키워드</span>'}${x.pri?'<span class="chip">⭐ 모의 오답</span>':''}
 <div class="psg" id="psg">${esc(t).replace(/\{\{|\}\}/g,'')}</div><div class="q">${esc(QT[(s.n+qi)%3](x))}</div>
 <textarea id="ta" placeholder="개념명 → 의미 → ${esc(x.p3)} 순서로 핵심어를 넣어 쓰세요."></textarea>
 <div class="row" style="margin-top:10px"><button class="btn" id="sub">제출<kbd>Ctrl+Enter</kbd></button><button class="btn l" id="idk">모르겠어요</button></div><div id="fb"></div></div>`;
 $('#hm').onclick=e=>{e.preventDefault();home()};$('#ta').focus();$('#sub').onclick=()=>submit();$('#idk').onclick=()=>submit(true)}
function submit(idk){if(cur.done)return;const {x,v}=cur,ans=idk?'':$('#ta').value;if(!idk&&!ans.trim()){$('#ta').focus();return}
 cur.done=true;const g=grade(x,v,ans);cur.lv=g.lv;if(mode==='day')rec(x.i,g.lv);else if(g.lv!=='ok')rec(x.i,g.lv);
 const {t}=sc(x,v),cue=(t.match(/\{\{(.+?)\}\}/)||[])[1]||'';
 const L={ok:['ok','정답! 개념명·의미·'+x.p3+' 모두 들어갔어요.'],weak:['weak','개념명은 맞았어요. 빠진 부분을 채우세요 → 2일 뒤 다시'],no:['no','공식 개념명이 없어요 → 내일 다시']}[g.lv];
 $('#ta').readOnly=true;$('#sub').style.display=$('#idk').style.display='none';
 $('#psg').innerHTML=esc(t).replace(/\{\{(.+?)\}\}/,'<span class="cue">$1</span>');
 $('#fb').innerHTML=`<div class="res ${L[0]}">${L[1]}</div>${x.nx&&!g.nameOK&&has(ans,x.nx.join('|'))?`<div class="res no">${esc(x.wn)}</div>`:''}<ul class="ck">
 <li>${g.nameOK?'✅':'❌'} 개념명: <b>${esc(x.n)}</b></li>
 <li>${g.meanOK?'✅':'❌'} 의미 핵심어 ${g.mHit.length}/${g.need} — ${x.mk.map(k=>esc(k.split('|')[0])).join(', ')}</li>
 <li>${g.pOK?'✅':'❌'} ${esc(x.p3)} — 예: ${x.pk.map(k=>esc(k.split('|')[0])).join(' / ')}</li></ul>
 <div class="fb"><h4>지문 단서 → 공식 키워드</h4><div><span class="cue">${esc(cue)}</span> → <b>${esc(x.n)}</b></div>
 <h4>모범 답안</h4><div class="model">㉠은 <b>${esc(x.n)}</b>이다. 이는 ${esc(x.mean)}을(를) 말한다.<br>${esc(x.p3)}: ${esc(x.plan)}.</div>
 <h4>🧩 암기</h4><div class="mn">${esc(x.mn)}</div><p class="mut">선정 근거: ${esc(x.ev)}</p></div>
 <div class="row">${g.lv!=='ok'&&mode==='day'?'<button class="btn l" id="ovr">제대로 썼는데 놓쳤어요 → 정답 처리</button>':''}<button class="btn" id="nx">다음<kbd>Enter</kbd></button></div>`;
 $('#nx').onclick=next;if($('#ovr'))$('#ovr').onclick=()=>{const s=S.k[x.i];s.h.pop();s.n--;rec(x.i,'ok');$('#ovr').remove();$('.res').className='res ok';$('.res').textContent='정답으로 처리했어요.'};$('#nx').focus()}
function next(){qi++;show()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&cur&&!cur.done&&$('#ta')){e.preventDefault();submit()}
 else if(e.key==='Enter'&&!e.ctrlKey&&document.activeElement.tagName!=='TEXTAREA'){if(cur&&cur.done&&$('#nx')){e.preventDefault();next()}else if($('#go')&&!$('#go').disabled){e.preventDefault();$('#go').click()}}});
home();
</script></body></html>
