<header><div class="hd"><button class="ib" id="backBtn" aria-label="홈으로" hidden>←</button><h1 id="ttl">📘 교육학 <b>논술 암기</b></h1>
<nav id="nav"><button data-n="home" class="on"><span class="ic">🏠</span>홈</button><button data-n="today"><span class="ic">⚡</span>오늘 복습</button><button data-n="wrong"><span class="ic">📕</span>오답<span class="bd" id="wbd"></span></button><button data-n="card"><span class="ic">🃏</span>카드</button><button data-n="con"><span class="ic">📚</span>개념</button><button data-n="stats"><span class="ic">📊</span>통계</button></nav>
<button class="ib" id="theme" aria-label="다크 모드 전환">🌙</button></div></header>
<main id="app"></main>
<script>
const DATA=/*__DATA__*/;
const LS='edu_quiz_v1';let st=JSON.parse(localStorage.getItem(LS)||'{}');st.sr=st.sr||{};st.wr=st.wr||{};st.hist=st.hist||{};st.days=st.days||{};
const save=()=>localStorage.setItem(LS,JSON.stringify(st));
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const DAY=864e5,IV=[0,1,3,7,14,30],GOAL=30;
const dk=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function streak(){let n=0,t=Date.now();if(!st.days[dk(t)])t-=DAY;while(st.days[dk(t)]){n++;t-=DAY}return n}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1600)}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
st.hint=st.hint||{};const HU=new Set();
function grade(id,ok){const r=st.sr[id]||{b:0,d:0};const hu=ok&&HU.has(id);if(hu){r.b=1;r.d=Date.now()+DAY;toast('💡 힌트 사용 → 약한 정답(1일 후 재복습)')}else{r.b=ok?Math.min(r.b+1,5):0;r.d=Date.now()+(ok?IV[r.b]*DAY:10*60e3)}st.sr[id]=r;
 const h=st.hist[id]||{c:0,w:0};ok?h.c++:h.w++;if(hu)h.hc=(h.hc||0)+1;st.hist[id]=h;if(!ok)st.wr[id]=(st.wr[id]||0)+1;else if(!hu&&st.wr[id]&&r.b>=2)delete st.wr[id];
 const k=dk();st.days[k]=(st.days[k]||0)+1;if(st.days[k]===GOAL)setTimeout(()=>toast('🎉 오늘 목표 '+GOAL+'문항 달성!'),300);save();buzz(ok?15:[30,40,30]);sess[ok?'c':'w']++;badge()}

  const K=x.ol.flatMap(r=>r[2].split(/[,\/]|·(?=[^ ])/).map(s=>s.replace(/^[^:]*:\s*/,'').trim()).filter(Boolean)),hit=K.filter(k=>wtHas(t,k.replace(/\(.*\)/,''))),mk=(t.match(/○/g)||[]).length;
  const ok=hit.length>=Math.ceil(K.length*0.5)?true:hit.length>=Math.ceil(K.length*0.3)?'p':false,used=60-left;
  $('#ex').innerHTML=`<div class="card" style="margin:10px 0"><b>내 개요 점검</b><div class="meta">작성 시간 ${used}초 ${used<=60?'✅':'⚠️ 1분 초과'} · 주체 ○ 표시 ${mk?'✅ '+mk+'곳':'❌ 없음'} · 핵심어 ${hit.length}/${K.length}</div></div><div class="ans"><b>모범 개요</b>${x.ol.map((r,n)=>`<div style="margin-top:6px">${n+1}. <b>${esc(r[0])}</b> ${r[1]!=='—'?`<span class="tag">○ ${esc(r[1])}</span>`:''}<br><span class="meta">${r[2].split(/,\s*/).map(k=>wtHas(t,k.replace(/\(.*\)/,'').split(/[\/:]/).pop().trim())?`<b>${esc(k)}</b>`:esc(k)).join(', ')}</span></div>`).join('')}</div><div class="meta">내 개요:<br>${esc(t).replace(/\n/g,'<br>').replace(/○/g,'<b style="color:var(--acc)">○</b>')}</div>${judgeRow(ok===true)}`;
  bindJudge(x.id,ok===true?true:ok===false?false:undefined);$('#ex').scrollIntoView({behavior:'smooth',block:'nearest'})};KEY=null}
document.addEventListener('keydown',e=>{if(e.isComposing)return;const tag=(e.target.tagName||'');if(e.key==='Escape'){home();return}
 if((tag==='INPUT'||tag==='TEXTAREA')&&e.key!=='Enter')return;if(tag==='INPUT'||tag==='TEXTAREA')return;if(tag==='BUTTON'&&(e.key==='Enter'||e.key===' '))e.preventDefault();if(KEY){if(e.key===' ')e.preventDefault();KEY(e)}});
const applyTheme=t=>{document.documentElement.dataset.theme=t;$('#theme').textContent=t==='dark'?'☀️':'🌙';document.querySelectorAll('meta[name=theme-color]').forEach(m=>m.content=t==='dark'?'#0f1217':'#f5f6f8')};
applyTheme(localStorage.getItem('edu_quiz_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('edu_quiz_theme',t);applyTheme(t)};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{const n=b.dataset.n;n==='home'?home():n==='stats'?statsView():n==='con'?conView():start(n)});
$('#backBtn').onclick=()=>{if(VIEW==='quiz'&&F.c)conOne(F.c);else if(VIEW==='conOne')conView();else home()};badge();home();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
